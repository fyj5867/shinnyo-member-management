<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="信徒管理">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>信徒管理</title>
<style>
:root{--g:#1e554b;--gd:#173b35;--bg:#f3f6f4;--line:#dfe7e2;--muted:#64736c;--warn:#b4561b;--ok:#2d7a4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#1b302b;font-size:15px}
header{background:var(--gd);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px}
header b{font-size:17px}
#syncBtn{background:rgba(255,255,255,.14);color:#fff;border-radius:20px;padding:6px 11px;font-size:12px}
#syncBtn.ok::before{content:"● ";color:#7be0a3}#syncBtn.err::before{content:"● ";color:#ff9c7a}#syncBtn.busy::before{content:"● ";color:#ffd77a}#syncBtn.off::before{content:"○ "}
main{max-width:1000px;margin:auto;padding:12px 12px 100px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;color:var(--muted);border-radius:0;padding:10px 2px;font-size:12px;font-weight:600}
nav.tabs button.on{color:var(--g);box-shadow:inset 0 3px 0 var(--g)}
nav.tabs button i{display:block;font-style:normal;font-size:18px}
button{border:0;border-radius:10px;padding:10px 13px;background:var(--g);color:#fff;font-weight:650;font-size:14px;cursor:pointer}
button:disabled{opacity:.45}
button.alt{background:#e2eee8;color:var(--g)}button.warn{background:#f6e3d8;color:var(--warn)}button.sm{padding:6px 10px;font-size:12px}
input,select,textarea{width:100%;padding:10px;border:1px solid #d4ded8;border-radius:9px;font-size:15px;background:#fff;font-family:inherit}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}
h2{font-size:17px;margin:0 0 8px}h3{font-size:14px;margin:12px 0 6px}
.muted{font-size:12px;color:var(--muted);line-height:1.6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>.grow{flex:1;min-width:120px}
.chip{display:inline-block;border-radius:20px;background:#e2eee8;color:var(--g);padding:2px 8px;font-size:11px;margin:0 3px 0 0}
.chip.dark{background:#2b4a3c;color:#fff}.chip.prac{background:#e8e4f3;color:#4b3f7a}.unpaid{opacity:.6}.sec{margin:14px 0 2px;font-size:14px;color:var(--g)}.nm2{font-weight:600;cursor:pointer;margin-right:4px}
.chip.non{background:#f1ebdd;color:#7a6330}.chip.bad{background:#f6e3d8;color:var(--warn)}.chip.good{background:#dcefe3;color:var(--ok)}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff}
.card .t{font-weight:700}.card .s{font-size:12px;color:var(--muted);margin-top:2px}
.card.tap{cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.items{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.items label.ck,label.ck{display:inline-flex;align-items:center;gap:5px;margin:0;padding:6px 10px;border:1px solid var(--line);border-radius:20px;font-size:13px;color:#1b302b;background:#fafcfb}
.items label.ck input,label.ck input{width:auto;margin:0}.items label.ck.on{background:#e2eee8;border-color:var(--g);color:var(--g);font-weight:700}
.items input.n{width:60px;padding:5px 7px}
.notice{background:#fff7e7;border:1px solid #ead9b4;color:#6e592d;border-radius:10px;padding:10px;font-size:12px;line-height:1.6}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){.modal{align-items:center}.modal>div{border-radius:16px}}
table.t{width:100%;border-collapse:collapse;font-size:12px}table.t th,table.t td{border:1px solid var(--line);padding:5px 6px;text-align:left;white-space:nowrap}
.wrap{overflow:auto}
.tree ul{list-style:none;margin:0;padding-left:18px;border-left:1px dashed #c7d6ce}.tree>ul{border:0;padding:0}
.tree li{margin:5px 0}.tree .nm{font-weight:600;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:#173b35;color:#fff;padding:9px 15px;border-radius:20px;font-size:13px;z-index:30;display:none;max-width:90%}
#toast.err{background:#9b3b12}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block}
  #printArea h1{font-size:18px;margin:0 0 4px}#printArea table{width:100%;border-collapse:collapse;font-size:11px}
  #printArea th,#printArea td{border:1px solid #444;padding:4px 5px;text-align:left}}
</style>
</head>
<body>
<header><b id="appTitle">信徒管理</b><button id="syncBtn" class="off" onclick="go('settings')">尚未同步</button></header>
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>
<div id="toast"></div>
<div id="modal" class="modal hidden"><div id="modalBody"></div></div>
<div id="printArea"></div>

<script src="sync.js"></script>
<script src="store.js"></script>
<script>
'use strict';
/* ═══════ 基本工具 ═══════ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const money = n => (Math.round(n * 100) / 100).toLocaleString('zh-TW');
const FEE = [['yuan', '苑費'], ['cert', '祈年證'], ['star', '星供'], ['set', '套子']];
const ST = { member: '入信', non: '非入信' };

function toast(msg, kind) {
  const t = $('#toast'); t.textContent = msg; t.className = kind === 'err' ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', kind === 'err' ? 4500 : 2200);
}

/* ═══════ 資料存取 ═══════ */
const P = () => SMStore.all('people'), SEATS = () => SMStore.all('seats'), YR = () => SMStore.all('yearly');
const byId = (arr, id) => arr.find(x => x.id === id);
const cfgGet = (name, dflt) => { const d = SMStore.get('config', name); return d && d.data != null ? d.data : dflt; };
const cfgSet = (name, data) => SMStore.put('config', { id: name, data });
const orgName = () => cfgGet('org', { name: '' }).name || '';
function price(year, key) {
  const p = cfgGet('prices', { def: {}, byYear: {} });
  const y = p.byYear && p.byYear[year];
  if (y && y[key] != null && y[key] !== '') return num(y[key]);
  return num(p.def && p.def[key]);
}
function yearRow(year, pid) { return SMStore.get('yearly', year + ':' + pid) || { id: year + ':' + pid, year, pid, yuan: false, cert: false, star: false, set: 0, rep: '', yuanPaid: '', starPaid: '', starSent: false, note: '' }; }
const dueA = r => (r.yuan ? price(r.year, 'yuan') : 0) + (r.cert ? price(r.year, 'cert') : 0);          /* 苑費＋祈年證 */
const dueB = r => (r.star ? price(r.year, 'star') : 0) + num(r.set) * price(r.year, 'set');             /* 星供＋套子 */
const due = r => dueA(r) + dueB(r);
const hasAny = r => r.yuan || r.cert || r.star || num(r.set) > 0;

/* 關係圖：mentorId = 引入信的人。導親 = 引人結緣者；導子 = 導親直接引的人；所屬 = 導子再引入信的人（不論幾代） */
const children = id => P().filter(p => p.mentorId === id);
/* 所屬：導子再引入信的人，不論第幾代（對導親而言統稱所屬） */
const belong = id => { const out = [], seen = new Set([id]); let cur = children(id); while (cur.length) { const nxt = []; for (const c of cur) for (const k of children(c.id)) if (!seen.has(k.id)) { seen.add(k.id); out.push(k); nxt.push(k); } cur = nxt; } return out; };
function wouldLoop(pid, mentorId) { let cur = mentorId, n = 0; while (cur && n++ < 50) { if (cur === pid) return true; const m = byId(P(), cur); cur = m && m.mentorId; } return false; }

/* ═══════ 導覽 ═══════ */
const TABS = [['people', '👥', '信徒'], ['year', '📋', '年度'], ['stats', '📊', '統計'], ['lineage', '🌳', '關係圖'], ['apply', '📝', '申請'], ['import', '📥', '匯入'], ['settings', '⚙️', '設定']];
let tab = 'people';
const ui = { q: '', seat: '', status: '', year: (new Date().getMonth() >= 9 ? new Date().getFullYear() + 1 : new Date().getFullYear()), onlyTicked: false, lineRoot: '', scope: 'member', onlyApply: false, idle: '', prac: '' };
function go(t) { tab = t; renderAll(); scrollTo(0, 0); }
function renderTabs() { $('#tabs').innerHTML = TABS.map(([k, ic, n]) => `<button class="${k === tab ? 'on' : ''}" onclick="go('${k}')"><i>${ic}</i>${n}</button>`).join(''); }
function renderAll() {
  if (!$('#modal').classList.contains('hidden')) { renderSyncBtn(); return; }   /* 編輯中不重畫，避免吃掉輸入 */
  const o = orgName(); $('#appTitle').textContent = o ? o + '　信徒管理' : '信徒管理';
  renderTabs(); renderSyncBtn();
  ({ people: vPeople, year: vYear, stats: vStats, lineage: vLineage, apply: vApply, seats: vSeats, import: vImport, settings: vSettings })[tab]();
}
function renderSyncBtn() { const s = SMSync.status(); const b = $('#syncBtn'); b.className = s.cls; b.textContent = s.txt; }

const seatName = id => { const s = byId(SEATS(), id); return s ? s.name : ''; };
const seatOpts = sel => '<option value="">（未分會座）</option>' + SEATS().slice().sort((a, b) => a.name.localeCompare(b.name, 'zh-TW')).map(s => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
function filterPeople() {
  const q = ui.q.trim().toLowerCase();
  return P().filter(p => p.active !== false)
    .filter(p => !ui.status || p.status === ui.status)
    .filter(p => !q || [p.name, p.phone, p.code, p.roman, p.sid, p.note].some(x => String(x || '').toLowerCase().includes(q)))
    .sort((a, b) => String(a.name).localeCompare(String(b.name), 'zh-TW'));
}
function filterBar(extra, noStatus) {
  return `<div class="row"><div class="grow"><input placeholder="搜尋姓名／電話／編號" value="${esc(ui.q)}" oninput="ui.q=this.value;renderListOnly()"></div>
  ${noStatus ? '' : `<select style="width:auto" onchange="ui.status=this.value;renderAll()"><option value="">入信＋非入信</option><option value="member" ${ui.status === 'member' ? 'selected' : ''}>入信</option><option value="non" ${ui.status === 'non' ? 'selected' : ''}>非入信</option></select>`}${extra || ''}</div>`;
}
function renderListOnly() { const l = $('#list'); if (l) l.innerHTML = (tab === 'year' ? yearList() : tab === 'stats' ? statsBody() : tab === 'apply' ? applyList() : ui.scope === 'non' ? nonList() : peopleList()); }

/* ═══════ 信徒 ═══════ */
const headOf = p => (p.famOf && byId(P(), p.famOf)) || p;          /* 戶長：家族成員掛在戶長名下，沒掛的人自己就是戶長 */
function roleOf(p) {                                               /* 導親／導子／所屬／家族（對最上層導親而言） */
  if (p.famOf) return '家族入信';
  let d = 0, cur = p, n = 0; while (cur && cur.mentorId && n++ < 60) { cur = byId(P(), cur.mentorId); d++; }
  return d === 0 ? (children(p.id).length ? '導親' : '') : d === 1 ? '導子' : '所屬';
}
/* ═══════ 星供未入信名單（單獨管理，不計入信徒人數／關係圖／實績）═══════ */
function scopedPeople(st) {
  const keep = ui.status; ui.status = ''; const rows = filterPeople().filter(p => st === 'non' ? p.status === 'non' : p.status !== 'non'); ui.status = keep; return rows;
}
function fixNonFamily() {
  const bad = P().filter(p => p.status === 'non' && p.famOf);
  if (!bad.length) return toast('沒有需要修正的人');
  if (!confirm('有 ' + bad.length + ' 位未入信者被掛成家族入信成員。'+String.fromCharCode(10)+'要全部改成獨立的未入信名單嗎？原本的繳費歸屬會保留（改記為由原戶長代繳）。')) return;
  const yrs = [], ppl = bad.map(p => Object.assign({}, p, { famOf: '' }));
  bad.forEach(p => YR().filter(r => r.pid === p.id && !r.rep).forEach(r => yrs.push(Object.assign({}, r, { rep: p.famOf }))));
  SMStore.putMany('people', ppl); if (yrs.length) SMStore.putMany('yearly', yrs); renderAll(); toast('已修正 ' + bad.length + ' 人');
}
function nonList() {
  const y = ui.year, rows = scopedPeople('non');
  if (!rows.length) return '<div class="muted" style="padding:20px;text-align:center">還沒有未入信名單。匯入星供名單時標示「(未入信)」的人會自動放在這裡。</div>';
  const nb = P().filter(p => p.status === 'non' && p.famOf).length;
  return `<div class="muted">共 ${rows.length} 人（只用於星供申請，不計入信徒人數、關係圖與實績）</div>${nb ? `<div class="notice" style="margin:6px 0">有 ${nb} 位未入信者被掛成家族入信成員。<button class="sm" onclick="fixNonFamily()">一鍵改回獨立名單</button></div>` : ''}` + rows.map(p => {
    const h = headOf(p), pay = payerOf(y, p), r = yearRow(y, p.id);
    return `<div class="card tap" onclick="editPerson('${p.id}')"><div class="t">${esc(p.name)} <span class="chip non">未入信</span>${r.star ? `<span class="chip good">${y} 星供</span>` : ''}${p.deceased ? '<span class="chip bad">歿</span>' : ''}</div>
    <div class="s">${h.id !== p.id ? '隨 ' + esc(h.name) + ' 申請' : '獨立'}${pay.id !== p.id ? '｜代表繳費：' + esc(pay.name) : ''}${p.phone ? '｜' + esc(p.phone) : ''}</div></div>`;
  }).join('');
}

/* ═══════ 申請（護摩／超度／布施／接心／會座／星供，依年度）═══════ */
const APPLY = [['homa', '護摩', '填寫內容'], ['chodo', '超度', '填寫內容'], ['sesshin', '接心', '填寫類別'], ['kaiza', '會座', '填寫內容']];
const applyOf = r => !!(r.homa || r.chodo || r.bushi || r.sesshin || r.kaiza || r.star);
function setApply(pid, k, v) { const r = yearRow(ui.year, pid); r[k] = v; saveYear(r); }
function applyPeople() { const y = ui.year; return filterPeople().filter(alive).filter(p => !ui.onlyApply || applyOf(yearRow(y, p.id))); }
function applyList() {
  const y = ui.year, rows = applyPeople();
  const all = filterPeople().filter(alive).map(p => yearRow(y, p.id));
  const cnt = [...APPLY.map(([k, n]) => [n, all.filter(r => r[k]).length]), ['布施', all.filter(r => r.bushi).length], ['星供', all.filter(r => r.star).length]];
  const sum = `<div class="muted">${y} 年申請：${cnt.map(([n, c]) => `${n} ${c}`).join('｜')}（共 ${rows.length} 人顯示）</div>`;
  return sum + (rows.map(p => {
    const r = yearRow(y, p.id);
    const tx = APPLY.map(([k, n, ph]) => `<div><label>${n}</label><input value="${esc(r[k] || '')}" placeholder="${ph}" onchange="setApply('${p.id}','${k}',this.value.trim())"></div>`).join('');
    return `<div class="card"><div class="t" style="cursor:pointer" onclick="editPerson('${p.id}')">${esc(p.name)} ${p.status === 'non' ? '<span class="chip non">未入信</span>' : ''}${applyOf(r) ? '<span class="chip good">有申請</span>' : ''}</div>
    <div class="grid2">${tx}</div>
    <div class="items"><label class="ck ${r.bushi ? 'on' : ''}"><input type="checkbox" ${r.bushi ? 'checked' : ''} onchange="tick('${p.id}','bushi',this.checked)">布施</label>
    <label class="ck ${r.star ? 'on' : ''}"><input type="checkbox" ${r.star ? 'checked' : ''} onchange="tick('${p.id}','star',this.checked)">星供</label></div></div>`;
  }).join('') || '<div class="muted" style="padding:20px;text-align:center">沒有符合的人</div>');
}
function applySheet() {
  const y = ui.year, list = filterPeople().filter(alive).filter(p => applyOf(yearRow(y, p.id)));
  const rows = list.map((p, i) => { const r = yearRow(y, p.id); return [i + 1, p.name, ST[p.status] || '入信', r.homa || '', r.chodo || '', r.bushi ? '✓' : '', r.sesshin || '', r.kaiza || '', r.star ? '✓' : '']; });
  return { title: `${y} 年度 申請總表`, head: ['序', '姓名', '身分', '護摩', '超度', '布施', '接心', '會座', '星供'], rows, n: rows.length };
}
function vApply() {
  const y = ui.year;
  $('#view').innerHTML = `<div class="row"><h2 class="grow" style="margin:0">申請</h2>
  <select style="width:auto" onchange="ui.year=+this.value;renderAll()">${[y - 1, y, y + 1].map(v => `<option ${v === y ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
  <div class="panel">${filterBar(`<label class="ck"><input type="checkbox" ${ui.onlyApply ? 'checked' : ''} onchange="ui.onlyApply=this.checked;renderAll()">只看有申請</label>`)}
  <div class="row" style="margin-top:10px"><button class="sm" onclick="outputSheet(applySheet())">匯出／列印 申請總表</button></div>
  <div class="muted" style="margin-top:6px">護摩、超度、接心、會座：有填內容＝有申請；布施、星供：勾選＝申請。星供的費用在「年度」頁收。入信與未入信的人都在這裡。</div></div>
  <div id="list">${applyList()}</div>`;
}

const PRAC = ['奉侍', '護摩', '超度', '布施', '接心', '法會', '家集', '會座', '智流學院'];
const pracOf = p => (p.prac || []).concat(p.pracOther ? [p.pracOther] : []);
/* 實績：只有「獨立戶」（不含家族入信成員）、入信、未歿，且當年度有申請苑費並已繳，才算實績 */
function creditOf(p, y) {
  if (p.famOf || p.status === 'non' || p.deceased) return '';
  if (!yearRow(y, p.id).yuan) return 'none';
  return yearRow(y, payerOf(y, p).id).yuanPaid ? 'ok' : 'unpaid';
}
function creditChip(p, y) {
  const c = creditOf(p, y);
  return c === 'ok' ? `<span class="chip good">${y} 苑費繳交</span>` : c === 'unpaid' ? `<span class="chip bad">${y} 苑費未繳</span>` : c === 'none' ? `<span class="chip bad">${y} 未申請苑費</span>` : '';
}
const notCounted = (p, y) => { const c = creditOf(p, y); return c === 'unpaid' || c === 'none'; };
function pracMatch(p) {
  if (ui.idle === 'idle' && !p.idle) return false;
  if (ui.idle === 'active' && p.idle) return false;
  if (ui.prac === '_none') return !pracOf(p).length;
  if (ui.prac === '_other') return !!p.pracOther;
  return !ui.prac || (p.prac || []).includes(ui.prac);
}
const pracChips = p => pracOf(p).map(k => `<span class="chip prac">${esc(k)}</span>`).join('');
function peopleList() {
  const rows = scopedPeople('member').filter(pracMatch), y = ui.year;
  if (!rows.length) return '<div class="muted" style="padding:20px;text-align:center">沒有資料。可到「匯入」讀取 Excel／PDF／Word／照片，或按「＋新增」。</div>';
  const heads = new Map(); rows.forEach(p => { const h = headOf(p); if (!heads.has(h.id)) heads.set(h.id, h); });
  const person = (p, hd) => `<span class="nm2" onclick="event.stopPropagation();editPerson('${p.id}')">${esc(p.name)}</span>${p.status === 'non' ? '<span class="chip non">非入信</span>' : ''}${p.deceased ? '<span class="chip bad">歿</span>' : ''}${p.idle && !hd.idle ? '<span class="chip bad">未精進</span>' : ''}${pracChips(p)}`;
  const card = h => {
    const m = byId(P(), h.mentorId), nc = children(h.id).length, role = roleOf(h);
    const fam = P().filter(x => x.famOf === h.id && x.active !== false && x.status !== 'non').sort((a, b) => byNameZh(a.name, b.name));

/* ═══════ 年度申請＋收費（以「戶」為繳費單位，仿原 Excel）═══════
   一戶＝戶長＋掛在他名下的家族成員。每人各自勾 苑費／祈年證／星供／套子；
   「苑費已收（含祈年證）」「星供已收（含套子）」「星供已發送」記在整戶（存在戶長那筆）。 */
const todayStr = () => new Date().toISOString().slice(0, 10);
const alive = p => p.active !== false && !p.deceased;
function members(headId) {
  const h = byId(P(), headId); if (!h) return [];
  return [h].concat(P().filter(x => x.famOf === headId).sort((a, b) => String(a.name).localeCompare(String(b.name), 'zh-TW'))).filter(alive);
}
/* 繳費代表（payer）：預設＝自己所屬戶的戶長；若某人的「代繳人」(rep) 有指定，就改由那個人代為繳費。
   一組＝同一位代表底下所有人（可跨戶，仿 Excel 星供名單的「組內序 1＝代表」），收費與已收／發送都記在代表那筆。 */
function payerOf(y, p, seen) {
  seen = seen || new Set(); if (seen.has(p.id)) return p; seen.add(p.id);
  const rep = yearRow(y, p.id).rep; if (rep === p.id) return p;
  const rp = rep && byId(P(), rep);
  if (rp && alive(rp)) return payerOf(y, rp, seen);
  const h = headOf(p); return h.id !== p.id && alive(h) ? payerOf(y, h, seen) : p;
}
const byNameZh = (a, b) => String(a).localeCompare(String(b), 'zh-TW');
function groupsFor() {
  const y = ui.year, by = new Map();
  P().filter(alive).forEach(p => { const k = payerOf(y, p), o = by.get(k.id) || { head: k, members: [] }; o.members.push(p); by.set(k.id, o); });
  const shown = new Set(filterPeople().filter(alive).map(p => p.id));
  return Array.from(by.values()).filter(g => g.members.some(m => shown.has(m.id))).map(g => {
    g.members.sort((a, b) => (b.id === g.head.id) - (a.id === g.head.id) || byNameZh(headOf(a).name, headOf(b).name) || (a.famOf ? 1 : 0) - (b.famOf ? 1 : 0) || byNameZh(a.name, b.name));

/* ═══════ 統計：依每個人申請的項目算費用 ═══════
   每人各項金額＝他勾的項目 × 當年度單價；已收＝所屬戶「苑費已收」「星供已收」對應到他那幾項。 */
function statRows(y) {
  return filterPeople().filter(alive).filter(p => hasAny(yearRow(y, p.id)))
    .sort((a, b) => { const pa = payerOf(y, a), pb = payerOf(y, b); return byNameZh(pa.name, pb.name) || (pb.id === b.id) - (pa.id === a.id) || byNameZh(headOf(a).name, headOf(b).name) || (a.famOf ? 1 : 0) - (b.famOf ? 1 : 0) || byNameZh(a.name, b.name); })
    .map(p => {
      const r = yearRow(y, p.id), hr = yearRow(y, payerOf(y, p).id);
      const it = { yuan: r.yuan ? price(y, 'yuan') : 0, cert: r.cert ? price(y, 'cert') : 0, star: r.star ? price(y, 'star') : 0, set: num(r.set) * price(y, 'set') };
      const pd = { yuan: hr.yuanPaid ? it.yuan : 0, cert: hr.yuanPaid ? it.cert : 0, star: hr.starPaid ? it.star : 0, set: hr.starPaid ? it.set : 0 };
      const total = it.yuan + it.cert + it.star + it.set, paid = pd.yuan + pd.cert + pd.star + pd.set;
      return { p, r, it, pd, total, paid };
    });
}
function statSheet() {
  const y = ui.year, rows = statRows(y);
  const head = ['繳費代表', '姓名', '身分', '會座', '苑費', '祈年證', '星供', '套子數', '套子費', '應收合計', '已收', '未收'];
  const body = rows.map(s => [payerOf(y, s.p).name, s.p.name, ST[s.p.status] || '入信', seatName(s.p.seatId), s.it.yuan || '', s.it.cert || '', s.it.star || '', num(s.r.set) || '', s.it.set || '', s.total, s.paid, s.total - s.paid]);
  const sum = i => rows.reduce((a, s) => a + (i === 7 ? num(s.r.set) : [0, 0, 0, 0, s.it.yuan, s.it.cert, s.it.star, 0, s.it.set, s.total, s.paid, s.total - s.paid][i]), 0);
  body.push(['', '合計', '', '', sum(4), sum(5), sum(6), sum(7), sum(8), sum(9), sum(10), sum(11)]);
  return { title: `${y} 年度 費用統計（依個人申請）`, head, rows: body, n: rows.length };
}
function statsBody() {
  const y = ui.year, rows = statRows(y);
  if (!rows.length) return '<div class="muted" style="padding:20px;text-align:center">這個範圍內還沒有人勾選申請項目。到「年度」頁勾選後這裡就會統計。</div>';
  const tot = rows.reduce((a, s) => ({ d: a.d + s.total, p: a.p + s.paid }), { d: 0, p: 0 });
  /* 依項目 */
  const itemRows = FEE.map(([k, n]) => {
    const cnt = rows.reduce((a, s) => a + (k === 'set' ? num(s.r.set) : s.r[k] ? 1 : 0), 0), d = rows.reduce((a, s) => a + s.it[k], 0), p = rows.reduce((a, s) => a + s.pd[k], 0);
    return `<tr><td>${n}</td><td>${cnt}${k === 'set' ? ' 個' : ' 人'}</td><td>${money(price(y, k))}</td><td>${money(d)}</td><td>${money(p)}</td><td>${money(d - p)}</td></tr>`;
  }).join('');
  /* 依會座 */
  const bySeat = new Map();
  rows.forEach(s => { const k = seatName(s.p.seatId) || '未分會座', o = bySeat.get(k) || { n: 0, d: 0, p: 0 }; o.n++; o.d += s.total; o.p += s.paid; bySeat.set(k, o); });
  const seatRows = Array.from(bySeat.entries()).sort((a, b) => a[0].localeCompare(b[0], 'zh-TW')).map(([k, o]) => `<tr><td>${esc(k)}</td><td>${o.n}</td><td>${money(o.d)}</td><td>${money(o.p)}</td><td>${money(o.d - o.p)}</td></tr>`).join('');
  /* 依個人 */
  const cellN = v => v ? money(v) : '';
  const personRows = rows.map(s => `<tr><td style="cursor:pointer" onclick="editPerson('${s.p.id}')"><b>${esc(s.p.name)}</b>${s.p.famOf ? ' <span class="muted">家族</span>' : ''}</td><td>${cellN(s.it.yuan)}</td><td>${cellN(s.it.cert)}</td><td>${cellN(s.it.star)}</td><td>${num(s.r.set) ? num(s.r.set) + '×' + money(price(y, 'set')) : ''}</td><td><b>${money(s.total)}</b></td><td>${cellN(s.paid)}</td><td style="color:${s.total - s.paid > 0 ? 'var(--warn)' : 'var(--ok)'}">${money(s.total - s.paid)}</td></tr>`).join('');
  return `<div class="row" style="gap:6px"><div class="card grow" style="margin:4px 0"><div class="s">申請人數</div><div class="t">${rows.length}</div></div><div class="card grow" style="margin:4px 0"><div class="s">應收</div><div class="t">${money(tot.d)}</div></div><div class="card grow" style="margin:4px 0"><div class="s">已收</div><div class="t">${money(tot.p)}</div></div><div class="card grow" style="margin:4px 0"><div class="s">未收</div><div class="t" style="color:var(--warn)">${money(tot.d - tot.p)}</div></div></div>
  <h3>依項目</h3><div class="wrap"><table class="t"><tr><th>項目</th><th>申請</th><th>單價</th><th>應收</th><th>已收</th><th>未收</th></tr>${itemRows}</table></div>
  <h3>依個人（${rows.length} 人）</h3><div class="wrap"><table class="t"><tr><th>姓名</th><th>苑費</th><th>祈年證</th><th>星供</th><th>套子</th><th>合計</th><th>已收</th><th>未收</th></tr>${personRows}</table></div>`;
}

const TRANS = [['trans3', new RegExp('傳授\\s*(?:III|Ⅲ)[^\\d]{0,3}' + DATE_RE)], ['trans2', new RegExp('傳授\\s*(?:II|Ⅱ)(?![IⅠⅡⅢ])[^\\d]{0,3}' + DATE_RE)], ['trans1', new RegExp('傳授\\s*(?:I|Ⅰ)(?![IⅠⅡⅢ])[^\\d]{0,3}' + DATE_RE)]];
const truthy = v => !!v && !/^(0|否|無|n|no|x|-)$/i.test(v);

function doImport() {
  saveTpl();
  const col = k => imp.map.indexOf(k), data = imp.hdr ? imp.rows.slice(1) : imp.rows;
  const g = (r, k) => { const i = col(k); return i < 0 ? '' : cell(r[i]); };
  const people = P().map(p => Object.assign({}, p)), seatByName = new Map(SEATS().map(s => [s.name, s])), newSeats = [];
  const yearly = new Map(), Y = imp.year;
  const yr = pid => { const id = Y + ':' + pid; if (!yearly.has(id)) yearly.set(id, Object.assign({}, yearRow(Y, pid))); return yearly.get(id); };
  const touched = new Map(); let added = 0, merged = 0, skipped = 0, stubs = 0, fams = 0;
  const block = ['qin', 'zi', 'sun'].some(k => col(k) >= 0);
  const ensure = (name, phone) => {
    let p = people.find(x => x.name === name && (!phone || !x.phone || x.phone === phone)), isNew = !p;
    if (isNew) { p = { id: uid(), name, status: 'member', active: true }; people.push(p); added++; } else if (!touched.has(p.id)) merged++;
    touched.set(p.id, p); return { p, isNew };
  };
  const links = []; let root = null, lastZi = null, head = null, curRep = null; const hasGrp = col('grp') >= 0;
  for (const r of data) {
    let role = '', famRow = false, nonMember = false, nmRaw = '', qinName = '';
    const nameCol = g(r, 'name');
    if (block) {
      const lin = [['qin', g(r, 'qin')], ['zi', g(r, 'zi')], ['sun', g(r, 'sun')]].filter(([, v]) => v);
      const main = lin.find(([k]) => k !== 'qin') || lin[0], famCol = g(r, 'fam');
      if (main && /^[（(]?未入信[)）]?$/.test(main[1])) { famRow = nonMember = true; nmRaw = nameCol || famCol; }
      else if (main) { role = main[0]; nmRaw = main[1]; const q = lin.find(([k]) => k === 'qin'); if (q && q !== main) qinName = splitSid(q[1]).name; }
      else if (famCol) { famRow = true; nmRaw = famCol; }
      else if (nameCol) { famRow = true; nmRaw = nameCol; }
    } else nmRaw = nameCol;
    const { name, sid, dead } = splitSid(nmRaw);
    if (!name || /^(姓名|合計|總計|導親|導子|導孫|所屬)$/.test(name) || /御守/.test(name)) { skipped++; continue; }
    const phone = g(r, 'phone').replace(/[^\d+\-() ]/g, '');
    const { p, isNew } = ensure(name, phone);
    const set = (k, v) => { if (v && !p[k]) p[k] = v; };      /* 只補空白，不蓋掉手改過的 */
    if (dead && !p.deceased) p.deceased = '歿';
    set('phone', phone); set('sid', sid); set('email', g(r, 'email')); set('roman', g(r, 'roman')); set('addr', g(r, 'addr')); set('code', g(r, 'code')); set('rank', g(r, 'rank')); set('seatRole', g(r, 'seatRole'));
    set('joinedOn', parseDate(g(r, 'joinedOn')) || g(r, 'joinedOn')); const b = g(r, 'birth'); set('birth', parseDate(b) || b);
    const st = g(r, 'status'); if (nonMember) p.status = 'non'; else if (st && isNew) p.status = /非|否|未/.test(st) ? 'non' : 'member';
    const nt = g(r, 'note');
    if (nt) {
      const dm = nt.match(new RegExp('歿\\s*' + DATE_RE)) || nt.match(new RegExp(DATE_RE + '\\s*[(（]\\s*歿')); if (dm && (!p.deceased || p.deceased === '歿')) p.deceased = parseDate(dm[1]); else if (/歿/.test(nt) && !p.deceased) p.deceased = '歿';
      const am = nt.match(ADDR_RE); if (am) set('addr', am[0]); const em = nt.match(MAIL_RE); if (em) set('email', em[0]);
      const sm = nt.match(/S\d{7}/i); if (sm) set('sid', sm[0].toUpperCase());
      TRANS.forEach(([k, re]) => { const m = nt.match(re); if (m) set(k, parseDate(m[1])); });
      if (!String(p.note || '').includes(nt)) p.note = p.note ? p.note + '；' + nt : nt;
    }
    const sn = g(r, 'seat');
    if (sn && !p.seatId) { let s = seatByName.get(sn); if (!s) { s = { id: uid(), name: sn }; seatByName.set(sn, s); newSeats.push(s); } p.seatId = s.id; }
    /* 關係圖／家族 */
    if (famRow) { if (head && head.id !== p.id) { if (p.status === 'non') { if (!hasGrp) yr(p.id).rep = head.id; } else if (!p.famOf && !head.famOf) { p.famOf = head.id; fams++; } } }   /* 未入信者不算家族入信，只記「由誰代為申請」 */
    else if (block) {
      head = p;
      if (role === 'qin') { root = p; lastZi = null; }
      else if (role === 'zi') { lastZi = p; const mn = qinName || (root && root.name); if (mn && mn !== p.name) links.push([p, mn]); }
      else if (role === 'sun') { const mn = qinName || (lastZi && lastZi.name) || (root && root.name); if (mn && mn !== p.name) links.push([p, mn]); }
    } else { head = p; const mn = g(r, 'mentor'); if (mn && mn !== p.name) links.push([p, mn]); }
    /* 繳費代表：有「組內序」欄時，1＝新一組的代表，>1＝跟著上一位代表，空白＝自己 */
    let payer = head;
    if (hasGrp) { const n = num(g(r, 'grp')); if (n === 1) curRep = p; else if (!(n > 1 && curRep)) curRep = null; payer = curRep || p; if (payer.id !== p.id) yr(p.id).rep = payer.id; else if (p.famOf) yr(p.id).rep = p.id; }
    /* 年度勾選與收費狀態（收費狀態記在繳費代表那筆；沒有組內序欄就記在戶長） */
    if (col('yuan') >= 0 && truthy(g(r, 'yuan'))) yr(p.id).yuan = true;
    if (col('cert') >= 0 && truthy(g(r, 'cert'))) yr(p.id).cert = true;
    if (col('star') >= 0 && truthy(g(r, 'star'))) yr(p.id).star = true;
    if (col('set') >= 0) { const raw = num(g(r, 'set').replace(/[^\d.]/g, '')), ps = price(Y, 'set'); const q = ps > 0 && raw >= ps && raw % ps === 0 ? raw / ps : raw; if (q > 0) yr(p.id).set = q; }
    if (payer) { ['yuanPaid', 'starPaid'].forEach(k => { const v = xlDate(g(r, k)); if (v) yr(payer.id)[k] = v; }); if (truthy(g(r, 'starSent'))) yr(payer.id).starSent = true; }
  }
  for (const [p, mn] of links) {
    if (p.mentorId) continue;
    let m = people.find(x => x.name === mn);
    if (!m) { m = { id: uid(), name: mn, status: 'member', active: true, note: '（由匯入的導親欄自動建立）' }; people.push(m); touched.set(m.id, m); stubs++; }
    p.mentorId = m.id;
  }
  const byid = new Map(people.map(p => [p.id, p]));     /* 循環保護：匯入若造成循環，斷開那一條 */
  for (const p of people) { let cur = p, n = 0; while (cur && cur.mentorId && n < 60) { cur = byid.get(cur.mentorId); n++; } if (n >= 60) { p.mentorId = ''; touched.set(p.id, p); } }
  if (!SMStore.putMany('seats', newSeats) || !SMStore.putMany('people', Array.from(touched.values())) || !SMStore.putMany('yearly', Array.from(yearly.values()))) return toast('儲存失敗：瀏覽器空間不足', 'err');
  imp.rows = [];
  $('#view').innerHTML = `<div class="panel"><h2>匯入完成</h2><div>新增 ${added} 人｜合併更新 ${merged} 人${fams ? `｜家族成員 ${fams} 人` : ''}${stubs ? `｜由導親欄補建 ${stubs} 人` : ''}${newSeats.length ? `｜新增 ${newSeats.length} 個會座` : ''}${yearly.size ? `｜${Y} 年度資料 ${yearly.size} 筆` : ''}${skipped ? `｜略過 ${skipped} 列` : ''}</div>
  <div class="muted" style="margin-top:6px">請到「關係圖」核對導親／導子／所屬有沒有排對，到「年度」${yearly.size ? `（選 ${Y}）` : ''}核對各戶。判斷錯的人，點進去修改導親或戶長即可。</div><div class="row" style="margin-top:10px"><button onclick="go('lineage')">看關係圖</button><button class="alt" onclick="ui.year=${Y};go('year')">看年度</button><button class="alt" onclick="go('people')">看名單</button></div></div>`;
  toast('匯入完成');
}
async function readPdf(f) {
  await loadLib('pdf'); pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise, out = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const items = (await (await doc.getPage(n)).getTextContent()).items.filter(i => i.str.trim());
    const lines = []; items.sort((a, b) => b.transform[5] - a.transform[5] || a.transform[4] - b.transform[4]);
    for (const it of items) { const y = it.transform[5], L = lines.find(l => Math.abs(l.y - y) < 3); if (L) L.t.push(it); else lines.push({ y, t: [it] }); }
    for (const L of lines) { L.t.sort((a, b) => a.transform[4] - b.transform[4]);
      const cells = []; let cur = null;                                        /* 依水平間距切欄 */
      for (const it of L.t) { const x = it.transform[4]; if (cur && x - cur.end < 8) { cur.s += it.str; cur.end = x + it.width; } else { cur = { s: it.str, end: x + it.width }; cells.push(cur); } }
      out.push(cells.map(c => c.s.trim())); }
  }
  if (!out.length) throw new Error('這份 PDF 沒有可讀的文字（可能是掃描圖片）。請改用 Excel／Word，或先 OCR 成可選取文字的 PDF');
  return out;
}
async function readDocx(f) {
  await loadLib('mammoth');
  const html = (await mammoth.convertToHtml({ arrayBuffer: await f.arrayBuffer() })).value;
  const dom = new DOMParser().parseFromString(html, 'text/html'), rows = [];
  dom.querySelectorAll('table tr').forEach(tr => rows.push([...tr.children].map(td => td.textContent.trim())));
  if (!rows.length) dom.querySelectorAll('p').forEach(p => { const t = p.textContent.trim(); if (t) rows.push(/\t|\s{2,}/.test(t) ? t.split(/\t|\s{2,}/) : t.split(/\s+/)); });
  if (!rows.length) throw new Error('Word 裡沒有讀到表格或文字');
  return rows;
}

/* ═══════ 設定、同步、備份 ═══════ */
function vSettings() {
  const info = SMSync.info(), y = ui.year, pr = cfgGet('prices', { def: {}, byYear: {} }), py = (pr.byYear && pr.byYear[y]) || {};
  const priceIn = (k, n) => `<div><label>${n}</label><input type="number" min="0" id="pr_${k}" value="${py[k] != null ? py[k] : ''}" placeholder="${pr.def && pr.def[k] != null ? '預設 ' + pr.def[k] : '0'}"></div>`;
  $('#view').innerHTML = `<h2>設定</h2>
  <div class="panel"><h3 style="margin-top:0">跨裝置同步</h3>${info ? `<div class="muted">已連線 GitHub：${esc(info.login)}（${info.encrypted ? '已加密' : '未加密'}）<br>${info.lastSync ? '最近同步 ' + new Date(info.lastSync).toLocaleString('zh-TW') : ''}</div>
  <div class="row" style="margin-top:8px"><button class="sm" onclick="SMSync.now(true)">立即同步</button><button class="alt sm" onclick="showPair()">配對碼（加第二台裝置）</button><button class="warn sm" onclick="if(confirm('中斷此裝置的同步？本機資料會保留。')){SMSync.disconnect();renderAll()}">中斷</button></div>
  ${SMSync.needsPassphrase() ? '<div class="notice" style="margin-top:8px">雲端資料有加密，請輸入同步密語：<input id="pp" type="password" style="margin:6px 0"><button class="sm" onclick="usePass()">確定</button></div>' : ''}`
  : `<div class="notice">信徒資料是高度隱私資訊：<b>資料存在你自己的加密私密 Gist</b>，網站原始碼裡沒有任何人名。沒有同步密語就不會上傳；密語忘記就無法解開，請另外記下。</div>
  <label>方法一：第一台裝置</label><div class="muted">① <a href="${SMSync.TOKEN_URL}" target="_blank" rel="noopener">建立 GitHub 金鑰（只勾 gist）</a> → 複製 ghp_ 開頭那串</div>
  <input id="tk" placeholder="貼上金鑰 ghp_…" autocomplete="off"><input id="pp" type="password" placeholder="自訂同步密語（至少 8 字，要記住）" style="margin-top:6px" autocomplete="new-password">
  <button style="margin-top:8px" onclick="doConnect()">連線並開始同步</button>
  <label>方法二：第二台以後（手機）</label><input id="pc" placeholder="貼上第一台產生的配對碼 SM1.…"><input id="pp2" type="password" placeholder="同步密語（配對碼已含金鑰時可留空）" style="margin-top:6px"><button class="alt" style="margin-top:8px" onclick="doPair()">用配對碼連線</button>`}</div>
  <div class="panel"><h3 style="margin-top:0">單位名稱（列印抬頭）</h3><input id="org" value="${esc(orgName())}" placeholder="例：○○苑"><button class="sm" style="margin-top:8px" onclick="cfgSet('org',{name:$('#org').value.trim()});toast('已儲存')">儲存</button></div>
  <div class="panel"><h3 style="margin-top:0">${y} 年度金額</h3><div class="grid2">${FEE.map(([k, n]) => priceIn(k, n)).join('')}</div>
  <div class="row" style="margin-top:8px"><button class="sm" onclick="savePrices(false)">只存 ${y} 年</button><button class="alt sm" onclick="savePrices(true)">存成各年預設</button></div>
  <div class="muted" style="margin-top:6px">金額只存在你的加密資料裡，不在網站程式碼中。</div></div>
  <div class="panel"><h3 style="margin-top:0">備份</h3><div class="row"><button class="alt sm" onclick="backup()">下載備份 JSON</button><button class="alt sm" onclick="$('#rf').click()">從備份還原</button><input id="rf" type="file" accept=".json" class="hidden" onchange="restore(this.files[0])"></div>
  <div class="muted" style="margin-top:6px">備份檔含完整個資，請存在私人位置，不要放進 GitHub。</div></div>
  <div class="muted" style="text-align:center">目前 ${P().length} 人｜${SEATS().length} 會座｜${YR().length} 筆年度資料</div>`;
}
function savePrices(asDef) {
  const y = ui.year, pr = cfgGet('prices', { def: {}, byYear: {} }); pr.def = pr.def || {}; pr.byYear = pr.byYear || {}; pr.byYear[y] = pr.byYear[y] || {};
  FEE.forEach(([k]) => { const v = $('#pr_' + k).value; pr.byYear[y][k] = v === '' ? null : num(v); if (asDef && v !== '') pr.def[k] = num(v); });
  cfgSet('prices', pr); toast('已儲存'); renderAll();
}
async function doConnect() {
  const pass = $('#pp').value; if (pass.length < 8) return toast('同步密語至少 8 個字', 'err');
  try { const r = await SMSync.connect($('#tk').value, pass); toast(r.created ? '已建立加密雲端資料庫' : '已連上既有資料庫'); } catch (e) { toast(e.code === 'needpass' ? '雲端已有資料，請輸入原本的密語' : e.message, 'err'); }
  renderAll();
}
async function doPair() {
  try { await SMSync.connect($('#pc').value, $('#pp2').value); toast('已連線'); } catch (e) { toast(e.code === 'needpass' ? '請輸入同步密語' : e.message, 'err'); }
  renderAll();
}
async function usePass() { try { await SMSync.setPassphrase($('#pp').value); } catch (e) { toast(e.message, 'err'); } renderAll(); }
function showPair() {
  openModal(`<h2>配對碼</h2><div class="notice">這串碼<b>等同你的金鑰＋密語</b>，拿到的人能讀寫所有信徒資料。只貼進你自己的第二台裝置，用完刪掉訊息。</div>
  <textarea id="pcv" rows="5" readonly style="margin-top:8px;font-size:12px">${esc(SMSync.pairCode())}</textarea>
  <div class="row" style="margin-top:10px"><button class="grow" onclick="$('#pcv').select();navigator.clipboard&&navigator.clipboard.writeText($('#pcv').value);toast('已複製')">複製</button><button class="alt" onclick="closeModal()">關閉</button></div>`);
}
function backup() {
  const blob = new Blob([JSON.stringify(SMStore.read(), null, 1)], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'members-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function restore(f) {
  if (!f) return; const rd = new FileReader();
  rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d || !Array.isArray(d.people)) throw 0;
    if (!confirm(`備份含 ${d.people.length} 人。與目前資料「合併」（同一筆以較新者為準），確定？`)) return;
    SMStore.write(SMSync.mergeData(SMStore.read(), Object.assign({ deleted: {} }, d))); SMSync.schedule(500); renderAll(); toast('已還原'); } catch (e) { toast('這不是有效的備份檔', 'err'); } };
  rd.readAsText(f);
}

/* ═══════ 啟動 ═══════ */
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
SMStore.attach(() => renderAll(), toast);
renderAll();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
