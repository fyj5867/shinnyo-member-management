<title>信徒管理</title>
<style>
:root{--g:#1e554b;--gd:#173b35;--bg:#f3f6f4;--line:#dfe7e2;--muted:#64736c;--warn:#b4561b;--ok:#2d7a4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#1b302b;font-size:15px}
header{background:var(--gd);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px}
header b{font-size:17px}
#syncBtn{background:rgba(255,255,255,.14);color:#fff;border-radius:20px;padding:6px 11px;font-size:12px}
#syncBtn.ok::before{content:"● ";color:#7be0a3}#syncBtn.err::before{content:"● ";color:#ff9c7a}#syncBtn.busy::before{content:"● ";color:#ffd77a}#syncBtn.off::before{content:"○ "}
main{max-width:1100px;margin:auto;padding:12px 12px 100px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;color:var(--muted);border-radius:0;padding:9px 1px;font-size:11.5px;font-weight:600;min-width:0}
nav.tabs button.on{color:var(--g);box-shadow:inset 0 3px 0 var(--g)}
nav.tabs button i{display:block;font-style:normal;font-size:18px}
button{border:0;border-radius:10px;padding:10px 13px;background:var(--g);color:#fff;font-weight:650;font-size:14px;cursor:pointer}
button.alt{background:#e2eee8;color:var(--g)}button.warn{background:#f6e3d8;color:var(--warn)}button.sm{padding:6px 10px;font-size:12px}
input,select,textarea{width:100%;padding:10px;border:1px solid #d4ded8;border-radius:9px;font-size:15px;background:#fff;font-family:inherit}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}
h2{font-size:17px;margin:0 0 8px}h3{font-size:14px;margin:0 0 6px}
.muted{font-size:12px;color:var(--muted);line-height:1.7}
.muted a,.nm a,.ref a{color:var(--g);cursor:pointer;font-weight:650}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>.grow{flex:1;min-width:120px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}
label.ck{display:inline-flex;align-items:center;gap:6px;margin:0;padding:7px 11px;border:1px solid var(--line);border-radius:20px;font-size:13px;color:#1b302b;background:#fafcfb;cursor:pointer}
label.ck input{width:auto;margin:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.notice{background:#fff7e7;border:1px solid #ead9b4;color:#6e592d;border-radius:10px;padding:10px;font-size:13px;line-height:1.7}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){.modal{align-items:center}.modal>div{border-radius:16px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:#173b35;color:#fff;padding:9px 15px;border-radius:20px;font-size:13px;z-index:30;display:none;max-width:90%}
#toast.err{background:#9b3b12}
/* 名冊 */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar .grow{flex:1;min-width:150px;width:auto}
.sum .big{font-size:15px}.sum .big b{font-size:22px;margin:0 2px}.lvc{display:inline-block;margin-left:10px;font-size:14px;color:var(--muted)}.lvc b{color:#1b302b;font-size:16px}
.fchip{background:#fff;border:1px solid var(--line);color:#1b302b;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:500}
.fchip b{margin-left:2px}.fchip.on{background:var(--g);color:#fff;border-color:var(--g)}
.tbl{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tr{display:grid;grid-template-columns:40px 40px 58px minmax(0,1fr) 46px 92px 116px 116px 34px;gap:6px;align-items:center;padding:5px 10px;border-top:1px solid var(--line);min-height:44px}
.tr.th{font-size:12px;color:var(--muted);border-top:0;background:#f7faf8;min-height:0;padding:7px 10px}
.tr.fam{background:#fafcfb;font-size:14px;min-height:36px}
.tr.dead .nm a{color:#9aa7a1;text-decoration:line-through;font-weight:500}
.fee{width:34px;height:30px;padding:0;border-radius:8px;background:#fff;border:1.5px dashed #b9c9c0;color:var(--muted);font-weight:800;font-size:15px}
.fee.v{background:#dcefe3;border:1.5px solid var(--ok);color:var(--ok)}
.fee.x{background:#f6e3d8;border:1.5px solid var(--warn);color:var(--warn)}
.paid{padding:5px 4px;font-size:12px;background:#fff;color:var(--g);border:1px solid #cfdcd5;border-radius:8px;font-weight:600}
.paid.on{background:var(--ok);color:#fff;border-color:var(--ok)}

.nm{display:flex;align-items:center;gap:6px;min-width:0}
.nm a{white-space:nowrap;flex-shrink:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;color:#1b302b}

.tr.fam .nm a{font-weight:500;color:#3d5249}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:3px 12px;margin-top:6px}
.ii{display:flex;align-items:baseline;gap:6px;min-width:0;line-height:1.5}.ii.wide{grid-column:1/-1}
.il{flex:none;font-size:12px;color:var(--muted);white-space:nowrap}
.iv{font-size:14px;color:#1b302b;white-space:nowrap;min-width:0}.ii.wide .iv{white-space:normal;overflow-wrap:anywhere}
.iv>span,.iv>a{white-space:nowrap}.iv a{color:var(--g);font-weight:650;cursor:pointer}
.bcl{display:inline-block;margin-left:8px;padding:0 8px;border-radius:10px;background:#e2eee8;font-size:12px;line-height:20px;text-decoration:none}

.cnt,.sub{font-size:11px;color:var(--muted);white-space:nowrap}

.add{width:30px;height:30px;padding:0;background:#e2eee8;color:var(--g);border-radius:8px;font-size:17px}
.c-d,.c-c,.c-p{font-size:12px;color:#4b5f57;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.fee.c.v{background:#ece8f6;border-color:#6b5ca5;color:#4b3f7a}
/* 名冊卡片 */
.chip.dark{background:#2b4a3c;color:#fff}.chip.pc{background:#e8e4f3;color:#4b3f7a;margin:2px 3px 2px 0}.chip.idle{background:#f6e3d8;color:var(--warn);margin:2px 3px 2px 0}
.fchip.sm{padding:5px 10px;font-size:12.5px}.fchip.v{background:#dcefe3;border-color:var(--ok);color:var(--ok);font-weight:700}.fchip.x{background:#f6e3d8;border-color:var(--warn);color:var(--warn);font-weight:700}
.fchip.c{background:#ece8f6;border-color:#6b5ca5;color:#4b3f7a;font-weight:700}.fchip.pd{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.hc .nm1{font-size:17px;font-weight:800;color:#1b302b;cursor:pointer}
.hc.dead .nm1,.fm.dead .hd>a{color:#9aa7a1;text-decoration:line-through}
.fams{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}.fams>a{cursor:pointer}
.fnames{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}.fn{white-space:nowrap;display:inline-flex;align-items:center;gap:4px}

.chip.non{background:#f1ebdd;color:#7a6330}
/* 星供、費用、奠供帳 */
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff}
.card .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card .hd .grow{flex:1;min-width:0}
.srow{display:grid;grid-template-columns:40px minmax(0,1fr) 100px 64px;gap:6px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.nm1{font-size:17px;font-weight:800;color:#1b302b;cursor:pointer}
.mbar{position:sticky;bottom:-16px;margin:14px -16px -16px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;z-index:2}

.edit{padding:4px 10px;font-size:12px;background:#e2eee8;color:var(--g);border-radius:8px;font-weight:700}
.card.cov{margin-left:18px;border-left:4px solid #e3c98f}
.phs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

a.btnlink{display:inline-block;text-align:center;border-radius:10px;padding:10px 13px;background:var(--g);color:#fff;font-weight:650;text-decoration:none}
.nonhd{margin-top:8px;padding:5px 8px;background:#f8f3e6;color:#7a6330;border-radius:8px;font-size:12px;font-weight:700}
.amtb{background:none;color:#1b302b;font-weight:800;font-size:14px;padding:6px 2px;border-radius:0;border-bottom:1.5px dashed #9fb5aa;text-align:right;white-space:nowrap}
.frm{display:flex;gap:8px;align-items:center;margin-top:10px}.frm label.ck{flex:none;min-width:96px}.frm .lab{flex:none;min-width:96px;font-size:13px;padding-left:11px}.frm input:not([type=checkbox]){flex:1;min-width:0}
.srow.th{border-top:0;font-size:11px;color:var(--muted);padding:2px 0}
.qty{display:flex;align-items:center;gap:3px}.qty button{width:30px;height:30px;padding:0;background:#e2eee8;color:var(--g);border-radius:8px;font-size:16px}.qty span{min-width:20px;text-align:center;font-weight:700}
.amt{text-align:right;font-weight:700;font-size:14px;white-space:nowrap}
.gfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;background:#f6faf8;border-radius:10px;padding:8px}
.frow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.frow input[type=checkbox],.card .hd input[type=checkbox]{width:20px;height:20px;margin:1px 0 0;flex:none}
.frow .who{flex:1;min-width:0}.frow .it{font-size:12px;color:var(--muted);margin-top:2px}.frow .t{font-weight:700;white-space:nowrap}
.feebar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:6;background:#173b35;color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.feebar b{font-size:19px;margin-left:4px}.feebar .grow{flex:1}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}.seg2 button{border-radius:0;background:#fff;color:var(--g);padding:7px 12px;font-size:13px}.seg2 button.on{background:var(--g);color:#fff}
.bal{font-weight:800;color:var(--ok)}.bal.neg{color:var(--warn)}
.ent .il{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:2px 0}.ent .il .m{font-size:12px;color:var(--muted)}
.pre{white-space:pre-wrap;font-size:13px;line-height:1.6;background:#fafcfb;border:1px solid #eef2ef;border-radius:8px;padding:8px;margin-top:6px;word-break:break-word}
.irow{display:grid;grid-template-columns:minmax(0,1.3fr) 92px minmax(0,1fr) 36px;gap:6px;margin-bottom:6px}.irow input{padding:8px}.irow button{padding:0}
@media(max-width:560px){.irow{grid-template-columns:minmax(0,1fr) 84px 36px}.irow .i_memo{grid-column:1/3}.srow{grid-template-columns:36px minmax(0,1fr) 98px 56px;gap:5px}}
/* 實踐表 */
/* 實踐表跟著整頁上下捲（手機才順）；表格只在左右方向自己滑。表頭另外一張表，黏在畫面上方，左右跟著表身對齊 */
.mx{background:#fff;border:1px solid var(--line);border-radius:14px}
.mxh{position:sticky;top:var(--hdrH,53px);z-index:4;overflow:hidden;background:#f7faf8;border-radius:14px 14px 0 0;box-shadow:0 1px 0 var(--line)}
.mxb{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.mx table{border-collapse:separate;border-spacing:0;font-size:14px;table-layout:fixed}
.mx th,.mx td{border-bottom:1px solid var(--line);border-left:1px solid #eef2ef;padding:0;text-align:center;white-space:nowrap}
.mx th{font-size:12px;color:var(--muted);background:#f7faf8;padding:6px 4px;font-weight:600}
.mx .nmc{position:sticky;left:0;z-index:1;background:#fff;text-align:left;padding:6px 10px;border-left:0;border-right:1px solid var(--line);overflow:hidden;text-overflow:ellipsis}
.mx th.nmc{background:#f7faf8;z-index:2}
.mx .nmc a{font-weight:650;cursor:pointer;color:#1b302b}
.mx tr.fam .nmc a{font-weight:500;color:#3d5249}
.mx tr.idle .nmc a{color:#9aa7a1}
.mx td.c button{width:100%;height:38px;padding:0 4px;background:none;color:var(--ok);font-size:15px;border-radius:0;font-weight:700}

.mx td.o button{overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:500;color:#1b302b}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chips .fchip{flex:none}
@media(max-width:760px){.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-left:-4px;margin-right:-4px}}
#printArea{display:none}

  #printArea h1{font-size:16px;margin:0 0 4px}#printArea .pm{font-size:11px;margin-bottom:6px}
  #printArea table{width:100%;border-collapse:collapse;font-size:9.5px}

<body>
<header><b id="appTitle">信徒管理</b><button id="syncBtn" class="off" onclick="go('settings')">尚未同步</button></header>
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>
<div id="toast"></div>
<div id="modal" class="modal hidden"><div id="modalBody"></div></div>
<div id="printArea"></div>

<script src="sync.js"></script>
<script src="store.js"></script>
<script>
'use strict';
/* ═══════ 基本工具 ═══════ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const byNameZh = (a, b) => String(a || '').localeCompare(String(b || ''), 'zh-TW');
const dkey = v => { const m = String(v || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); return m ? m[1] + pad(m[2]) + pad(m[3]) : '99999999'; };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dotDate = () => { const d = new Date(); return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`; };
const md = v => { const m = String(v || '').match(/^(\d{4})\D(\d{1,2})\D(\d{1,2})$/); return m ? `${+m[2]}/${+m[3]}` : String(v || ''); };
/* 生日提醒：生日前 3 天到當天，名字旁出現蛋糕。只用月／日，不顯示出生年。2/29 生日在平年算 2/28 */
const BD_DAYS = 3;
function bdMD(p) {
  if (!p || p.deceased || !p.birth) return null;
  const n = String(p.birth).match(/\d+/g) || []; let m, d;
  if (n.length >= 3) { m = +n[1]; d = +n[2]; } else if (n.length === 2) { m = +n[0]; d = +n[1]; } else if (n.length === 1 && n[0].length === 8) { m = +n[0].slice(4, 6); d = +n[0].slice(6); }
  return m >= 1 && m <= 12 && d >= 1 && d <= 31 ? { m, d } : null;
}
function bdInfo(p) {
  const x = bdMD(p); if (!x) return null; const { m, d } = x;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const at = y => { const x = new Date(y, m - 1, d); if (x.getMonth() !== m - 1) x.setDate(0); return x; };
  let b = at(t.getFullYear()); if (b < t) b = at(t.getFullYear() + 1);
  return { m: b.getMonth() + 1, d: b.getDate(), days: Math.round((b - t) / 864e5), key: `${b.getFullYear()}-${b.getMonth() + 1}-${b.getDate()}` };
}
const bdSoon = p => { if (!p || p.status === 'non') return null; const b = bdInfo(p); return b && b.days <= BD_DAYS ? b : null; };
const bdWhen = b => b.days === 0 ? '今天' : b.days === 1 ? '明天' : b.days === 2 ? '後天' : `還有 ${b.days} 天`;
const cake = p => { const b = bdSoon(p); return b ? `<span class="cake" title="${b.m}/${b.d} 生日（${bdWhen(b)}）">🎂</span>` : ''; };
function toast(msg, kind) {
  const t = $('#toast'); t.textContent = msg; t.className = kind === 'err' ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', kind === 'err' ? 4500 : 2200);
}

/* ═══════ 資料 ═══════
   people：{ id, name, roman, birth, joinedOn, code, rank(院生號碼), teacherNo(教師號碼), phone, note, famOf(戶長), mentorId(導親), deceased, deathOn, ref(我的導親，參考用), ord(排序),
             prac(實踐勾選項目), pracDu(度眾人數), pracOther(實踐其他), ext{ 自訂欄位id: 值 } }

/* ═══════ 星供：照星供表的排法 ═══════
   一戶一組：戶長、家族入信、跟這戶一起申請的未入信者；未入信者也可以自成一組（後面接其他未入信者）。
   每人：星供（一人一份）、套子（份數）；戶長另有祈念證、苑費（和名冊同一份資料）。
   代繳：某組由別組付時，費用算進付錢那組的合計，苑費已收、星供已收、發送也一起記。 */
function nonHead(n) {
  const ix = IX(), g = n.grp && (ix.m.get(n.grp) || ix.nm.get(n.grp));
  if (!g || g.id === n.id || g.deceased) return n;
  if (g.status === 'non') return g.grp ? n : g;                       /* 只接受「自成一組」的未入信者當組長，不做連鎖 */
  const k = ix.kind.get(g.id); return k === 'family' ? ix.head.get(g.id) : k === 'house' ? g : n;
}
function starGroups(y) {
  const ix = IX(), gs = [], by = new Map(), mk = (head, ms, non) => { const g = { head, ms, non }; gs.push(g); by.set(head.id, g); return g; };
  ix.rows.forEach(h => { const ms = [h].concat(ix.fam.get(h.id) || []).filter(p => !p.deceased); if (ms.length) mk(h, ms, false); });
  const nons = [...ix.nm.values()].filter(p => !p.deceased).sort((a, b) => (a.ord || 0) - (b.ord || 0) || byNameZh(a.name, b.name));
  nons.forEach(n => { if (nonHead(n).id === n.id) mk(n, [n], true); });
  nons.forEach(n => { const h = nonHead(n); if (h.id === n.id) return; (by.get(h.id) || mk(n, [], true)).ms.push(n); });
  gs.forEach(g => { g.hr = yrOf(y, g.head.id); g.own = 0; g.star = 0;
    g.ms.forEach(p => { const it = feeItems(y, p); g.own += sumItems(it); g.star += sumItems(it.filter(x => x[2] === 'b')); });
    g.any = g.hr.fee === 'v' || g.hr.cert === 'v' || g.ms.some(p => { const r = yrOf(y, p.id); return r.star || r.set || (r.extra || []).length; }); });
  gs.forEach(g => { let p = g.hr.rep && by.get(g.hr.rep), n = 0; while (p && p.hr.rep && by.get(p.hr.rep) && by.get(p.hr.rep) !== g && n++ < 20) p = by.get(p.hr.rep); g.payer = p && p !== g ? p : null; });
  gs.forEach(g => { g.covers = gs.filter(x => x.payer === g); g.total = g.own + g.covers.reduce((a, x) => a + x.own, 0); });
  return { gs, by };
}

  const line = p => { let it = feeItems(y, p); if (ui.fUnpaid) it = it.filter(x => x[2] === 'a' ? !paidA(p) : !paidB(p)); return { p, it, t: sumItems(it) }; };
  const groups = []; ix.rows.forEach(h => { const ms = [h].concat(ix.fam.get(h.id) || []).filter(p => !p.deceased); if (ms.length) groups.push({ h, lines: ms.map(line) }); });
  return { groups, non: [...ix.nm.values()].filter(p => !p.deceased).sort((a, b) => byNameZh(a.name, b.name)).map(line) };
}

  <div id="fsum"></div><div id="flist" style="padding-bottom:64px"></div><div class="feebar" id="fbar"></div>`;

}

  const card = (title, ls) => { const sub = ls.reduce((a, x) => a + x.t, 0), all = ls.every(x => sel.has(x.p.id));

/* ═══════ 奠供帳照片：壓小存檔（看得清單據上的字即可）═══════
   參考飲食紀錄 App 的做法：先用 canvas 重畫成小張 JPEG 再存。單據要看得清字，所以長邊留 1000px、品質 0.5，一張約 50～90KB。
   這台裝置存在 IndexedDB（容量大，不佔 localStorage 那幾 MB）；有開同步時，每張另外上傳成一份加密私密 Gist。
   帳本紀錄只記 photos:[{id, gid}]，跟著主資料同步；其他裝置要看時才下載。 */
const PH_MAX = 1000, PH_Q = 0.5;
const PDB = (() => {
  let p = null; const mem = new Map();
  const open = () => p || (p = new Promise((ok, no) => { try { const r = indexedDB.open('sm-photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); } catch (e) { no(e); } }));
  const run = (mode, fn) => open().then(db => new Promise((ok, no) => { const t = db.transaction('p', mode), req = fn(t.objectStore('p')); t.oncomplete = () => ok(req && req.result); t.onerror = () => no(t.error); }));
  return { get: k => run('readonly', s => s.get(k)).catch(() => mem.get(k)), put: (k, v) => run('readwrite', s => s.put(v, k)).catch(() => { mem.set(k, v); }), del: k => run('readwrite', s => s.delete(k)).catch(() => { mem.delete(k); }) };

async function shrinkPhoto(file, mode) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('讀不了這張照片')); i.src = url; });
    const enc = (max, q, type) => { const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
      const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h); return c.toDataURL(type || 'image/jpeg', q); };
    if (mode === 'barcode') {                 /* 條碼：線條要清楚。截圖類的 PNG 通常很小；相機拍的太大才改高品質 JPEG */
      let d = enc(1200, 1, 'image/png'); if (d.length > 270000) d = enc(1200, 0.85); if (d.length > 270000) d = enc(1000, 0.8);
      return d;
    }
    /* 目標一張 100KB 以內（base64 約 136000 字）：先降品質，再縮尺寸；紙張紋路多的照片才會走到後面幾級 */

}
const phKB = d => Math.round(String(d || '').length * 0.75 / 1024);
let phBusy = false, ePh = [];
async function uploadPhotos() {                                            /* 有開同步就把還沒上傳的照片傳上去；失敗下次再試 */
  const bcTodo = () => SMStore.all('people').filter(p => p.bc && p.bc.id && !p.bc.gid);
  if (phBusy || !SMSync.connected() || (!LG().some(e => (e.photos || []).some(p => !p.gid)) && !bcTodo().length)) return; phBusy = true;
  try {
    for (const p of bcTodo()) {                                             /* 信徒號碼條碼圖 */
      const rec = await PDB.get(p.bc.id); if (!rec || !rec.data) continue;
      const gid = await SMSync.putPhoto(rec.data), cur = SMStore.all('people').find(x => x.id === p.id);
      if (cur && cur.bc && cur.bc.id === p.bc.id) SMStore.put('people', Object.assign({}, cur, { bc: Object.assign({}, cur.bc, { gid }) })); else SMSync.delPhoto(gid);
    }
    for (const e of LG()) {
      if (!(e.photos || []).some(p => !p.gid)) continue;
      const done = new Map();
      for (const p of e.photos) { if (p.gid) continue; const rec = await PDB.get(p.id); if (rec && rec.data) done.set(p.id, await SMSync.putPhoto(rec.data)); }
      const cur = done.size && LG().find(x => x.id === e.id);
      if (cur) SMStore.put('ledger', Object.assign({}, cur, { photos: (cur.photos || []).map(p => done.has(p.id) ? Object.assign({}, p, { gid: done.get(p.id) }) : p) }));
    }
  } catch (err) { console.warn('photo upload', err); } finally { phBusy = false; }
}
async function photoData(id, gid) {
  const rec = await PDB.get(id); if (rec && rec.data) return rec.data;
  if (!gid || !SMSync.connected()) return null;

}
function hydratePhotos(root) {

const phThumbs = ps => ps && ps.length ? `<div class="phs">${ps.map(p => `<img class="ph" data-ph="${p.id}" data-g="${p.gid || ''}" alt="照片" onclick="event.stopPropagation();viewPhoto('${p.id}','${p.gid || ''}')">`).join('')}</div>` : '';

   結餘／代支照貼文的數字存，帳本上這筆之後的金額就是它，不自己加總。 */
function parseLineNote(t) {
  const out = []; let cur = null;
  const dateRe = /^\s*(\d{4})[./-](\d{1,2})[./-](\d{1,2})\s*$/;
  const balRe = /^\s*[-－•・*]?\s*(結餘|餘額|代支|墊付|代墊|墊款)\s*[:：]?\s*(代支|墊付|代墊)?\s*(-?)\s*[$＄]?\s*(-?[\d,]+)\s*元?\s*$/;
  const itemRe = /^\s*[-－•・*]?\s*([^:：$＄]+?)\s*[:：]\s*(-?)\s*(?:[$＄]\s*(-?[\d,]+)|(-?[\d,]+)\s*元)\s*(.*)$/;
  const strip = s => s.trim().replace(/^[（(]\s*/, '').replace(/\s*[）)]$/, '');
  String(t || '').replace(/\r/g, '').split('\n').forEach(ln => {
    const dm = ln.match(dateRe);
    if (dm) { cur = { date: `${dm[1]}-${pad(dm[2])}-${pad(dm[3])}`, items: [], dep: [], text: [], stated: null }; out.push(cur); return; }
    if (!cur) { if (!ln.trim()) return; cur = { date: todayStr(), items: [], dep: [], text: [], stated: null }; out.push(cur); }
    const bm = ln.match(balRe);
    if (bm) { const n = Math.abs(amtOf(bm[4])), neg = /代支|墊付|代墊|墊款/.test(bm[1] + (bm[2] || '')) || !!bm[3] || /^-/.test(bm[4]); cur.stated = neg ? -n : n; return; }
    const im = ln.match(itemRe);
    if (im) { const name = im[1].trim(), amt = Math.abs(amtOf(im[3] || im[4])), memo = strip(im[5] || '');
      if (/結餘|餘額|代支|墊付|代墊|墊款/.test(name)) { cur.stated = /代支|墊付|代墊|墊款/.test(name) || im[2] || /^-/.test(im[3] || im[4] || '') ? -amt : amt; return; }   /* 「結餘：$10000（備註）」這種後面有字的 */
      if (/預存|存入|儲值|收款|匯款|入帳/.test(name)) cur.dep.push({ name, amt, memo }); else cur.items.push({ name, amt, memo }); return; }
    if (/^\s*[（(].*[）)]\s*$/.test(ln) && cur.items.length && !cur.text.length) { const it = cur.items[cur.items.length - 1]; it.memo = [it.memo, strip(ln)].filter(Boolean).join('；'); return; }
    cur.text.push(ln);
  });
  return out.map(b => Object.assign(b, { text: b.text.join('\n').replace(/^\s+|\s+$/g, '') })).filter(b => b.items.length || b.dep.length || b.text || b.stated != null);
}

/* 對人更新：先用信徒編號、再用姓名（唯一）對到原本的人，沿用原本的 id，星供／實踐／奠供帳就不會斷掉 */

  if (!imp) return;
  const olds = SMStore.all('people').filter(p => p.status !== 'non'), used = new Set(), idMap = new Map(), byCode = new Map(), byName = new Map();
  olds.forEach(o => { if (o.code) byCode.set(o.code, o); byName.set(o.name, (byName.get(o.name) || []).concat([o])); });
  imp.people.forEach(p => {
    let o = p.code && byCode.get(p.code); if (o && used.has(o.id)) o = null;
    if (!o) { const c = (byName.get(p.name) || []).filter(x => !used.has(x.id)); if (c.length === 1) o = c[0]; }
    if (o) { used.add(o.id); idMap.set(p.id, o); }

  if (olds.length && !confirm(`用這份 Excel 更新名冊：\n・對到 ${idMap.size} 人（更新資料，保留星供、實踐、奠供帳）\n・新增 ${added} 人${gone.length ? `\n・刪除 ${gone.length} 人（不在這份 Excel 裡）：${gone.slice(0, 8).map(o => o.name).join('、')}${gone.length > 8 ? '…' : ''}` : ''}\n確定？`)) return;

    : bdOn() ? '<div class="row" style="margin-top:8px"><span class="grow">這台裝置：通知已開啟</span><button class="alt sm" onclick="bdEnable(false)">關閉通知</button></div>'
    : `<button class="sm" style="margin-top:8px" onclick="bdEnable(true)">開啟這台裝置的通知</button>${Notification.permission === 'denied' ? '<div class="muted">通知權限被擋住了，請到手機「設定 → 通知 → 信徒管理」打開。</div>' : ''}`}
  <div class="muted" style="margin-top:6px">沒有推播主機，所以是<b>打開 App 或切回 App 時</b>才發通知，每人每次生日只通知一次。通知只寫姓名和月／日。</div>
  ${(() => { const all = icsPeople(), done = new Set(icsDone()), nw = all.filter(([p, x]) => !done.has(icsKey(p, x))).length;
    return `<label>加到手機行事曆（App 沒開也會提醒）</label>
  <div class="row">${done.size ? `<button class="sm" onclick="exportIcs(true)"${nw ? '' : ' disabled'}>只匯出新加的 ${nw} 人</button><button class="alt sm" onclick="if(confirm('全部重新匯出？iPhone 行事曆可能會多出重複的生日，要自己刪掉舊的。'))exportIcs(false)">全部重新匯出（${all.length} 人）</button>` : `<button class="sm" onclick="exportIcs(false)">匯出全部生日（${all.length} 人）</button>`}</div>
  <div class="muted" style="margin-top:6px">每人一個每年重複的行程，生日前 ${BD_DAYS} 天早上 9 點提醒，只寫姓名，不寫出生年。iPhone：按下去選「行事曆」或打開檔案 →「加入全部」。<b>請加到私人的行事曆，不要加到公司的 Outlook</b>（會同步到公司伺服器）。之後有人過世、改生日，要自己到行事曆刪掉舊的。</div>`; })()}</div>
  <div class="panel"><h3>單位名稱（列印抬頭）</h3><input id="org" value="${esc(orgName())}" placeholder="例：○○苑"><button class="sm" style="margin-top:8px" onclick="cfgSet('org',{name:$('#org').value.trim()});toast('已儲存')">儲存</button></div>
  <div class="panel"><h3>備份</h3><div class="row"><button class="alt sm" onclick="backup()">下載備份 JSON</button><button class="alt sm" onclick="$('#rf').click()">從備份還原</button><input id="rf" type="file" accept=".json" class="hidden" onchange="restore(this.files[0])"></div>
  <div class="muted" style="margin-top:6px">備份檔含完整個資，請存在私人位置，不要放進 GitHub。奠供帳的照片不在備份檔裡：照片存在拍照的裝置，開同步後另外加密存在雲端。</div></div>
  <div class="muted" style="text-align:center">目前 ${IX().m.size} 人｜${YR().length} 筆年度資料</div>`;
}
/* 生日通知：每台裝置自己開關（存在本機）。沒有推播主機，打開或切回 App 時檢查；同一人同一次生日只通知一次 */
const bdCan = () => 'Notification' in window && 'serviceWorker' in navigator;
const bdOn = () => bdCan() && Notification.permission === 'granted' && LSget('sm.bdOn') === '1';
async function bdEnable(on) {
  if (!on) { LSset('sm.bdOn', ''); toast('已關閉生日通知'); return renderAll(); }
  if (!bdCan()) return toast('這個瀏覽器不能發通知', 'err');
  let r = Notification.permission; try { if (r !== 'granted') r = await Notification.requestPermission(); } catch (e) {}
  if (r !== 'granted') { toast('沒有取得通知權限', 'err'); return renderAll(); }
  LSset('sm.bdOn', '1'); toast('已開啟生日通知'); renderAll(); bdNotify();
}
function bdNotify() {
  if (!bdOn()) return;
  let seen = []; try { seen = JSON.parse(LSget('sm.bdSeen') || '[]'); } catch (e) {}
  const list = [...IX().m.values()].map(p => [p, bdSoon(p)]).filter(([p, b]) => b && !seen.includes(p.id + '|' + b.key)).sort((a, b) => a[1].days - b[1].days);
  if (!list.length) return;
  LSset('sm.bdSeen', JSON.stringify(seen.concat(list.map(([p, b]) => p.id + '|' + b.key)).slice(-300)));
  const title = '🎂 生日提醒', body = list.map(([p, b]) => `${p.name} ${b.m}/${b.d}（${bdWhen(b)}）`).join('、');
  const fall = () => { try { new Notification(title, { body, icon: 'icon-192.png' }); } catch (e) {} };
  navigator.serviceWorker.getRegistration().then(r => r ? r.showNotification(title, { body, icon: 'icon-192.png', badge: 'icon-192.png', tag: 'sm-bday' }) : fall()).catch(fall);
}
/* 匯出到手機行事曆（.ics）：每人一個每年重複的全天行程，生日前 3 天早上 9 點提醒；只寫姓名，不寫出生年。
   UID 固定（bd-人id），同一人再匯一次是更新不是多一筆（Google、Outlook 會認；iPhone 可能還是會多一筆，所以預設只匯新加的人） */
const icsEsc = s => String(s).replace(/[\\;,]/g, c => '\\' + c).replace(/\r?\n/g, '\\n');
const icsFold = l => { const te = new TextEncoder(); if (te.encode(l).length <= 75) return l; let out = '', n = 0;
  for (const ch of l) { const b = te.encode(ch).length; if (n + b > 75) { out += '\r\n '; n = 1; } out += ch; n += b; } return out; };   /* 折行數位元組、只在字元之間斷，中文才不會被切壞 */
const icsKey = (p, x) => p.id + '|' + x.m + '-' + x.d;
const icsPeople = () => [...IX().m.values()].map(p => [p, bdMD(p)]).filter(x => x[1]).sort((a, b) => a[1].m - b[1].m || a[1].d - b[1].d || byNameZh(a[0].name, b[0].name));
const icsDone = () => { try { return JSON.parse(LSget('sm.icsDone') || '[]'); } catch (e) { return []; } };
function icsText(list) {
  const y = new Date().getFullYear(), d8 = t => `${t.getFullYear()}${pad(t.getMonth() + 1)}${pad(t.getDate())}`, stamp = new Date().toISOString().replace(/[-:]|\.\d+/g, '');
  const ev = list.map(([p, x]) => { const leap = x.m === 2 && x.d === 29, s = leap ? new Date(y, 2, 0) : new Date(y, x.m - 1, x.d), e = new Date(s); e.setDate(e.getDate() + 1);
    return ['BEGIN:VEVENT', `UID:bd-${p.id}@shinnyo-member`, 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + d8(s), 'DTEND;VALUE=DATE:' + d8(e),
      'RRULE:FREQ=YEARLY' + (leap ? ';BYMONTH=2;BYMONTHDAY=-1' : ''), 'SUMMARY:' + icsEsc(p.name + ' 生日'), 'TRANSP:TRANSPARENT',
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(`${p.name} ${BD_DAYS} 天後生日`), `TRIGGER:-P${BD_DAYS - 1}DT15H`, 'END:VALARM', 'END:VEVENT']; });
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//shinnyo-member//birthday//ZH', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'].concat(...ev, 'END:VCALENDAR').map(icsFold).join('\r\n') + '\r\n';
}
async function exportIcs(onlyNew) {
  const done = new Set(icsDone()), all = icsPeople(), list = onlyNew ? all.filter(([p, x]) => !done.has(icsKey(p, x))) : all;
  if (!list.length) return toast(onlyNew ? '沒有新加的人' : '沒有人填出生年月日', 'err');
  const name = 'birthdays-' + todayStr() + '.ics', blob = new Blob([icsText(list)], { type: 'text/calendar;charset=utf-8' });
  const mark = () => { LSset('sm.icsDone', JSON.stringify([...new Set([...done, ...list.map(([p, x]) => icsKey(p, x))])])); toast(`已匯出 ${list.length} 人的生日`); renderAll(); };
  const file = typeof File === 'function' ? new File([blob], name, { type: 'text/calendar' }) : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
    try { await navigator.share({ files: [file] }); return mark(); } catch (e) { if (e && e.name === 'AbortError') return; }   /* 取消分享就不要偷偷改成下載 */
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000); mark();
}
function savePrices(asDef) {
  const y = ui.year, pr = cfgGet('prices', { def: {}, byYear: {} }); pr.def = Object.assign({}, pr.def || {}); pr.byYear = Object.assign({}, pr.byYear || {}); pr.byYear[y] = Object.assign({}, pr.byYear[y] || {});
  FEES.forEach(([k]) => { const v = numClean($('#pr_' + k).value); pr.byYear[y][k] = v === '' ? null : +v; if (asDef && v !== '') pr.def[k] = +v; });
  cfgSet('prices', pr); toast('已儲存'); renderAll();
}
async function doConnect() {
  const pass = $('#pp').value; if (pass.length < 8) return toast('同步密語至少 8 個字', 'err');
  try { const r = await SMSync.connect($('#tk').value, pass); toast(r.created ? '已建立加密雲端資料庫' : '已連上既有資料庫'); } catch (e) { toast(e.code === 'needpass' ? '雲端已有資料，請輸入原本的密語' : e.message, 'err'); }
  renderAll();
}
async function doPair() {
  try { await SMSync.connect($('#pc').value, $('#pp2').value); toast('已連線'); } catch (e) { toast(e.code === 'needpass' ? '請輸入同步密語' : e.message, 'err'); }
  renderAll();
}
async function usePass() { try { await SMSync.setPassphrase($('#pp').value); } catch (e) { toast(e.message, 'err'); } renderAll(); }
function showPair() {
  openModal(`<h2>配對碼</h2><div class="notice">這串碼<b>等同你的金鑰＋密語</b>，拿到的人能讀寫所有信徒資料。只貼進你自己的第二台裝置，用完刪掉訊息。</div>
  <textarea id="pcv" rows="5" readonly style="margin-top:8px;font-size:12px">${esc(SMSync.pairCode())}</textarea>
  <div class="row" style="margin-top:10px"><button class="grow" onclick="$('#pcv').select();navigator.clipboard&&navigator.clipboard.writeText($('#pcv').value);toast('已複製')">複製</button><button class="alt" onclick="closeModal()">關閉</button></div>`);
}
function backup() {
  const blob = new Blob([JSON.stringify(SMStore.read(), null, 1)], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'members-backup-' + todayStr() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function restore(f) {
  if (!f) return; const rd = new FileReader();
  rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d || !Array.isArray(d.people)) throw 0;
    if (!confirm(`備份含 ${d.people.length} 人。與目前資料「合併」（同一筆以較新者為準），確定？`)) return;
    SMStore.write(SMSync.mergeData(SMStore.read(), Object.assign({ deleted: {} }, d))); SMSync.schedule(500); renderAll(); toast('已還原'); } catch (e) { toast('這不是有效的備份檔', 'err'); } };
  rd.readAsText(f);
}

/* ═══════ 啟動 ═══════ */
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
/* 同步每分鐘、每次切回 App 都會跑：資料真的有變才重畫，只是狀態變（同步中／已同步）就只更新右上角 */
SMStore.attach(changed => { if (changed === true) { renderAll(); bdNotify(); } else renderSyncBtn(); uploadPhotos(); }, toast);
const setHdrH = () => document.documentElement.style.setProperty('--hdrH', $('header').offsetHeight + 'px');
setHdrH(); addEventListener('resize', setHdrH);
renderAll(); uploadPhotos(); bdNotify();
/* 隔天才切回 App：重畫一次，蛋糕和名冊上方的生日提醒才會換成今天的 */
let bdDay = todayStr();
/* 金額、份數欄（class="num"）：手機開數字鍵盤；打成全形數字自動變半形，其他字去掉。
   電腦在注音模式按數字鍵會變成ㄅㄉˇ…：記下實際按的數字鍵，組字結束時換回數字，不用先切英文 */
let numK = null, numFix = null;
document.addEventListener('keydown', e => {
  const t = e.target; if (!t.classList || !t.classList.contains('num') || (e.key !== 'Process' && e.keyCode !== 229)) return;
  if (!numK || numK.t !== t || !numK.on) numK = { t, pre: t.value.slice(0, t.selectionStart), post: t.value.slice(t.selectionEnd), keys: '', on: false };
  const m = /^(?:Digit|Numpad)(\d)$/.exec(e.code || '');
  if (m) numK.keys += m[1]; else if (e.code === 'Minus' || e.code === 'NumpadSubtract') numK.keys += '-'; else if (e.code === 'Backspace') numK.keys = numK.keys.slice(0, -1);
}, true);
document.addEventListener('compositionstart', e => { if (numK && numK.t === e.target) numK.on = true; }, true);
document.addEventListener('compositionend', e => {
  const t = e.target; if (!t.classList || !t.classList.contains('num')) return; const k = numK && numK.t === t ? numK : null; numK = null; numFix = t;
  setTimeout(() => { numFix = null; const v = t.value, mid = k ? v.slice(k.pre.length, v.length - k.post.length) : v;
    const fixed = k && k.keys && /[^\d\s,-]/.test(half(mid)) ? k.pre + k.keys + k.post : v;      /* 打出來的不是數字（注音、中文）→ 用按的鍵 */
    const c = numClean(fixed); if (c !== v) t.value = c; });
}, true);
document.addEventListener('input', e => { const t = e.target; if (e.isComposing || numFix === t || !t.classList || !t.classList.contains('num')) return; numK = null; const c = numClean(t.value); if (c !== t.value) t.value = c; }, true);
document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') return; if (bdDay !== todayStr()) { bdDay = todayStr(); renderAll(); } bdNotify(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
