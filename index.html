<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="信徒管理">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>信徒管理</title>
<style>
:root{--g:#1e554b;--gd:#173b35;--bg:#f3f6f4;--line:#dfe7e2;--muted:#64736c;--warn:#b4561b;--ok:#2d7a4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#1b302b;font-size:15px}
header{background:var(--gd);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px}
header b{font-size:17px}
#syncBtn{background:rgba(255,255,255,.14);color:#fff;border-radius:20px;padding:6px 11px;font-size:12px}
#syncBtn.ok::before{content:"● ";color:#7be0a3}#syncBtn.err::before{content:"● ";color:#ff9c7a}#syncBtn.busy::before{content:"● ";color:#ffd77a}#syncBtn.off::before{content:"○ "}
main{max-width:1100px;margin:auto;padding:12px 12px 100px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;color:var(--muted);border-radius:0;padding:10px 2px;font-size:12px;font-weight:600}
nav.tabs button.on{color:var(--g);box-shadow:inset 0 3px 0 var(--g)}
nav.tabs button i{display:block;font-style:normal;font-size:18px}
button{border:0;border-radius:10px;padding:10px 13px;background:var(--g);color:#fff;font-weight:650;font-size:14px;cursor:pointer}
button.alt{background:#e2eee8;color:var(--g)}button.warn{background:#f6e3d8;color:var(--warn)}button.sm{padding:6px 10px;font-size:12px}
input,select,textarea{width:100%;padding:10px;border:1px solid #d4ded8;border-radius:9px;font-size:15px;background:#fff;font-family:inherit}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}
h2{font-size:17px;margin:0 0 8px}h3{font-size:14px;margin:0 0 6px}
.muted{font-size:12px;color:var(--muted);line-height:1.7}
.muted a,.nm a,.ref a{color:var(--g);cursor:pointer;font-weight:650}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>.grow{flex:1;min-width:120px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
label.ck{display:inline-flex;align-items:center;gap:6px;margin:0;padding:7px 11px;border:1px solid var(--line);border-radius:20px;font-size:13px;color:#1b302b;background:#fafcfb;cursor:pointer}
label.ck input{width:auto;margin:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.notice{background:#fff7e7;border:1px solid #ead9b4;color:#6e592d;border-radius:10px;padding:10px;font-size:13px;line-height:1.7}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){.modal{align-items:center}.modal>div{border-radius:16px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:#173b35;color:#fff;padding:9px 15px;border-radius:20px;font-size:13px;z-index:30;display:none;max-width:90%}
#toast.err{background:#9b3b12}
/* 名冊 */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar .grow{flex:1;min-width:150px;width:auto}
.sum .big{font-size:15px}.sum .big b{font-size:22px;margin:0 2px}.lvc{display:inline-block;margin-left:10px;font-size:14px;color:var(--muted)}.lvc b{color:#1b302b;font-size:16px}
.fchip{background:#fff;border:1px solid var(--line);color:#1b302b;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:500}
.fchip b{margin-left:2px}.fchip.on{background:var(--g);color:#fff;border-color:var(--g)}
.tbl{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tr{display:grid;grid-template-columns:40px 58px minmax(0,1fr) 46px 92px 116px 116px 34px;gap:6px;align-items:center;padding:5px 10px;border-top:1px solid var(--line);min-height:44px}
.tr.th{font-size:12px;color:var(--muted);border-top:0;background:#f7faf8;min-height:0;padding:7px 10px}
.tr.fam{background:#fafcfb;font-size:14px;min-height:36px}
.tr.dead .nm a{color:#9aa7a1;text-decoration:line-through;font-weight:500}
.fee{width:34px;height:30px;padding:0;border-radius:8px;background:#fff;border:1.5px dashed #b9c9c0;color:var(--muted);font-weight:800;font-size:15px}
.fee.v{background:#dcefe3;border:1.5px solid var(--ok);color:var(--ok)}
.fee.x{background:#f6e3d8;border:1.5px solid var(--warn);color:var(--warn)}
.paid{padding:5px 4px;font-size:12px;background:#fff;color:var(--g);border:1px solid #cfdcd5;border-radius:8px;font-weight:600}
.paid.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.paid.off{color:#c2cdc7;text-align:center;font-size:12px}
.nm{display:flex;align-items:center;gap:6px;min-width:0}
.nm a{white-space:nowrap;flex-shrink:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;color:#1b302b}
.nm .chip,.nm .sub,.nm .cnt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tr.fam .nm a{font-weight:500;color:#3d5249}
.tg{width:22px;flex:none;padding:0;background:none;color:var(--muted);font-size:13px}
.cnt,.sub{font-size:11px;color:var(--muted);white-space:nowrap}
.chip{display:inline-block;border-radius:20px;padding:1px 7px;font-size:11px;background:#eceeed;color:#6b7a73;white-space:nowrap}
.lv{font-size:11px;border-radius:10px;padding:2px 0;text-align:center;font-weight:700;display:inline-block;min-width:40px}
.lv0{background:#173b35;color:#fff}.lv1{background:#dbe8f6;color:#1d4f86}.lv2{background:#f5ead2;color:#7a5a12}.lvf{background:#eef1ef;color:#6b7a73;font-weight:500}
.add{width:30px;height:30px;padding:0;background:#e2eee8;color:var(--g);border-radius:8px;font-size:17px}
.c-d,.c-c,.c-p{font-size:12px;color:#4b5f57;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:760px){.tr{grid-template-columns:40px 56px minmax(0,1fr) 42px 32px;padding:5px 8px}.c-d,.c-c,.c-p{display:none}.lvc{display:block;margin:4px 0 0}}
#printArea{display:none}
@media print{@page{size:A4 landscape;margin:8mm}body>*:not(#printArea){display:none!important}#printArea{display:block}
  #printArea h1{font-size:16px;margin:0 0 4px}#printArea .pm{font-size:11px;margin-bottom:6px}
  #printArea table{width:100%;border-collapse:collapse;font-size:9.5px}
  #printArea th,#printArea td{border:1px solid #444;padding:3px 4px;text-align:left;vertical-align:top;white-space:pre-line}}
</style>
</head>
<body>
<header><b id="appTitle">信徒管理</b><button id="syncBtn" class="off" onclick="go('settings')">尚未同步</button></header>
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>
<div id="toast"></div>
<div id="modal" class="modal hidden"><div id="modalBody"></div></div>
<div id="printArea"></div>

<script src="sync.js"></script>
<script src="store.js"></script>
<script>
'use strict';
/* ═══════ 基本工具 ═══════ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const byNameZh = (a, b) => String(a || '').localeCompare(String(b || ''), 'zh-TW');
const dkey = v => { const m = String(v || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); return m ? m[1] + pad(m[2]) + pad(m[3]) : '99999999'; };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dotDate = () => { const d = new Date(); return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`; };
const md = v => { const m = String(v || '').match(/^(\d{4})\D(\d{1,2})\D(\d{1,2})$/); return m ? `${+m[2]}/${+m[3]}` : String(v || ''); };
function toast(msg, kind) {
  const t = $('#toast'); t.textContent = msg; t.className = kind === 'err' ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', kind === 'err' ? 4500 : 2200);
}

/* ═══════ 資料 ═══════
   people：{ id, name, roman, birth, joinedOn, code, rank(院生／教師號碼), phone, note, famOf(戶長), mentorId(導親), deceased, deathOn, ref(我的導親，參考用), ord(排序) }
   yearly：{ id: 年度:人id, year, pid, fee: 'v'要繳｜'x'不繳｜''未定, paid: 收款日 }，只記在獨立戶（戶長）那筆
   舊版的「未入信（星供名單）」人員一律不顯示；星供、祈年證、套子、代繳已拿掉。 */
const P = () => SMStore.all('people').filter(p => p.status !== 'non' && p.active !== false);
const YR = () => SMStore.all('yearly');
const cfgGet = (name, dflt) => { const d = SMStore.get('config', name); return d && d.data != null ? d.data : dflt; };
const cfgSet = (name, data) => SMStore.put('config', { id: name, data });
const orgName = () => cfgGet('org', { name: '' }).name || '';

/* ═══════ 分類規則（整個 App 唯一的判定來源）═══════
   1. 獨立戶：沒有掛戶長的人。苑費、層級、實績都以獨立戶計。
   2. 家族入信：掛在某位戶長名下。不是獨立戶、沒有苑費格、不算實績，跟戶長一起。掛在家族成員名下的，自動改掛最上層戶長。
   3. 層級以「戶」計：沒有導親＝導親；導親的導子＝導子；再往下不論幾代＝所屬。
      導親若是某戶的家族成員，算在那戶的戶長名下；家族成員自己的導親不採用。
   4. 我的導親（ref）：只做參考，不列入苑費與統計；掛在他名下的人仍是最上層的導親。 */
let _ix = null;
function IX() {
  if (_ix) return _ix;
  const all = P(), m = new Map(all.map(p => [p.id, p])), yr = new Map(YR().map(r => [r.id, r]));
  const push = (mp, k, v) => { if (!mp.has(k)) mp.set(k, []); mp.get(k).push(v); };
  const topHead = p => { const seen = new Set([p.id]); let cur = m.get(p.famOf); while (cur) { if (seen.has(cur.id) || cur.ref) return null; if (!cur.famOf) return cur; seen.add(cur.id); cur = m.get(cur.famOf); } return null; };
  const kind = new Map(), head = new Map(), fam = new Map(), mh = new Map(), kids = new Map();
  all.forEach(p => {
    if (p.ref) return kind.set(p.id, 'ref');
    if (!p.famOf) return kind.set(p.id, 'house');
    const h = topHead(p); if (!h) return kind.set(p.id, 'orphan');
    kind.set(p.id, 'family'); head.set(p.id, h); push(fam, h.id, p);
  });
  all.forEach(p => {
    if (kind.get(p.id) !== 'house') return;
    const t = m.get(p.mentorId); if (!t) return;
    const k = kind.get(t.id), hh = k === 'family' ? head.get(t.id) : k === 'house' ? t : null;
    if (hh && hh.id !== p.id) { mh.set(p.id, hh); push(kids, hh.id, p); }
  });
  const ord = (a, b) => (a.ord == null ? 1e9 : a.ord) - (b.ord == null ? 1e9 : b.ord) || dkey(a.joinedOn).localeCompare(dkey(b.joinedOn)) || byNameZh(a.name, b.name);
  fam.forEach(l => l.sort(ord)); kids.forEach(l => l.sort(ord));
  const rows = [], depth = new Map(), seen = new Set();
  const walk = (p, d) => { if (seen.has(p.id)) return; seen.add(p.id); depth.set(p.id, d); rows.push(p); (kids.get(p.id) || []).forEach(k => walk(k, d + 1)); };
  all.filter(p => kind.get(p.id) === 'house' && !mh.has(p.id)).sort(ord).forEach(p => walk(p, 0));
  const loops = all.filter(p => kind.get(p.id) === 'house' && !seen.has(p.id));
  _ix = { m, yr, kind, head, fam, mh, kids, rows, depth, loops, refs: all.filter(p => p.ref).sort(ord) };
  queueMicrotask(() => { _ix = null; });
  return _ix;
}
['put', 'putMany', 'del'].forEach(k => { const f = SMStore[k]; SMStore[k] = function () { _ix = null; return f.apply(this, arguments); }; });
const LV = ['導親', '導子', '所屬'];
const lvIdx = p => Math.min(IX().depth.get(p.id) || 0, 2);
const lvOf = p => IX().depth.has(p.id) ? LV[lvIdx(p)] : '';
function feeOf(y, pid) {
  const r = IX().yr.get(y + ':' + pid);
  return { id: y + ':' + pid, year: y, pid, fee: r ? (r.fee != null ? r.fee : r.yuan ? 'v' : '') : '', paid: r ? (r.paid != null ? r.paid : r.yuanPaid || '') : '' };
}
function wouldLoop(pid, mentorId) {
  const ix = IX(); let cur = ix.m.get(mentorId); if (cur && ix.kind.get(cur.id) === 'family') cur = ix.head.get(cur.id);
  const seen = new Set();
  while (cur && !seen.has(cur.id)) { if (cur.id === pid) return true; seen.add(cur.id); cur = ix.mh.get(cur.id); }
  return false;
}
/* 答案唯一的錯自動修：家族掛在家族名下 → 改掛最上層戶長；掛在自己名下 → 清掉 */
function fixData() {
  const ix = IX(), out = [];
  P().forEach(p => {
    if (!p.famOf) return;
    if (p.famOf === p.id) out.push(Object.assign({}, p, { famOf: '' }));
    else { const h = ix.head.get(p.id); if (h && h.id !== p.famOf) out.push(Object.assign({}, p, { famOf: h.id })); }
  });
  if (out.length) { SMStore.putMany('people', out); toast('已把 ' + out.length + ' 位家族成員改掛到最上層戶長'); }
}
/* 需要你決定的：[人, 說明] */
function dataIssues() {
  const ix = IX(), out = [];
  ix.m.forEach(p => {
    const k = ix.kind.get(p.id);
    if (k === 'orphan') out.push([p, '找不到戶長，請重新指定戶長，或改成獨立戶']);
    if (k === 'house' && p.mentorId && !ix.m.has(p.mentorId)) out.push([p, '導親已不在名冊裡，請重新指定']);
  });
  ix.loops.forEach(p => out.push([p, '導親關係繞成一圈，請改掉其中一人的導親']));
  return out;
}
function stats(y) {
  const ix = IX(), s = { lv: [0, 0, 0], v: 0, paid: 0, x: 0, none: 0, houses: 0, fam: 0, dead: 0 };
  ix.rows.forEach(p => {
    (ix.fam.get(p.id) || []).forEach(f => { if (f.deceased) s.dead++; else s.fam++; });
    if (p.deceased) { s.dead++; return; }
    s.houses++; const f = feeOf(y, p.id);
    if (f.fee === 'v') { s.v++; s.lv[lvIdx(p)]++; if (f.paid) s.paid++; } else if (f.fee === 'x') s.x++; else s.none++;
  });
  s.people = s.houses + s.fam; return s;
}

/* ═══════ 導覽 ═══════ */
const TABS = [['roster', '👥', '名冊'], ['settings', '⚙️', '設定']];
const ui = { tab: 'roster', year: new Date().getMonth() >= 9 ? new Date().getFullYear() + 1 : new Date().getFullYear(), q: '', f: '', fold: false, flip: new Set() };
let imp = null;
function go(t) { ui.tab = t; renderAll(); scrollTo(0, 0); }
function renderAll() {
  _ix = null; try { fixData(); } catch (e) { console.error(e); }
  renderSyncBtn();
  if (!$('#modal').classList.contains('hidden')) return;           /* 編輯中不重畫，避免吃掉輸入 */
  const o = orgName(); $('#appTitle').textContent = o ? o + '　信徒管理' : '信徒管理';
  $('#tabs').innerHTML = TABS.map(([k, ic, n]) => `<button class="${k === ui.tab ? 'on' : ''}" onclick="go('${k}')"><i>${ic}</i>${n}</button>`).join('');
  (ui.tab === 'settings' ? vSettings : vRoster)();
}
function renderSyncBtn() { const s = SMSync.status(), b = $('#syncBtn'); b.className = s.cls; b.textContent = s.txt; }
function openModal(html) { $('#modalBody').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); renderAll(); }

/* ═══════ 名冊（主畫面）═══════ */
function vRoster() {
  const y = ui.year, ys = new Set([y - 1, y, y + 1]); YR().forEach(r => { if (+r.year) ys.add(+r.year); });
  $('#view').innerHTML = `<div class="bar">
  <select style="width:auto" onchange="ui.year=+this.value;renderAll()">${[...ys].sort().map(v => `<option value="${v}" ${v === y ? 'selected' : ''}>${v} 苑費</option>`).join('')}</select>
  <input class="grow" placeholder="搜尋姓名、編號、手機、備註" value="${esc(ui.q)}" oninput="ui.q=this.value;renderList()">
  <button class="sm" onclick="editPerson('')">＋新增</button><button class="alt sm" onclick="doXlsx()">匯出 Excel</button><button class="alt sm" onclick="doPrint()">列印</button></div>
  <div id="sum"></div><div id="list" class="tbl"></div>`;
  renderList();
}
function renderList() { const s = $('#sum'), l = $('#list'); if (!s || !l) return; s.innerHTML = sumHtml(); l.innerHTML = listHtml(); }
function sumHtml() {
  const y = ui.year, ix = IX(), st = stats(y), py = stats(y - 1), iss = dataIssues();
  const chip = (k, n, c) => `<button class="fchip ${ui.f === k ? 'on' : ''}" onclick="ui.f=ui.f==='${k}'?'':'${k}';renderList()">${n}<b>${c}</b></button>`;
  return `<div class="panel sum"><div class="big">${y} 苑費要繳<b>${st.v}</b>戶<span class="lvc">導親 <b>${st.lv[0]}</b>｜導子 <b>${st.lv[1]}</b>｜所屬 <b>${st.lv[2]}</b></span></div>
  <div class="row" style="margin-top:8px">${chip('v', '要繳 v ', st.v)}${chip('unpaid', '未收 ', st.v - st.paid)}${chip('paid', '已收 ', st.paid)}${chip('x', '不繳 x ', st.x)}${chip('none', '未定 ', st.none)}
  <button class="fchip" onclick="ui.fold=!ui.fold;ui.flip.clear();renderList()">${ui.fold ? '展開家族' : '收合家族'}</button></div>
  <div class="muted" style="margin-top:6px">信徒 ${st.people} 人＝獨立戶 ${st.houses}＋家族入信 ${st.fam}${st.dead ? `（已歿 ${st.dead} 人不計）` : ''}。苑費格只在戶長那列，點一下切換 空白→v→x；家族跟著戶長，不算實績。</div>
  ${ix.refs.length ? `<div class="muted ref">我的導親（參考，不列入苑費與統計）：${ix.refs.map(r => `<a onclick="editPerson('${r.id}')">${esc(r.name)}</a>`).join('、')}</div>` : ''}
  ${!st.v && !st.x && (py.v || py.x) ? `<div class="notice" style="margin-top:8px">${y} 年還沒有點苑費。<button class="sm" onclick="carryOver()">帶入 ${y - 1} 年的 v／x</button></div>` : ''}
  ${iss.length ? `<div class="notice" style="margin-top:8px"><b>資料檢查：${iss.length} 項要你確認</b>（點名字修改）${iss.map(([p, t]) => `<div><a onclick="editPerson('${p.id}')">${esc(p.name)}</a>：${esc(t)}</div>`).join('')}</div>` : ''}</div>`;
}
const isOpen = id => ui.fold ? ui.flip.has(id) : !ui.flip.has(id);
function flip(id) { ui.flip.has(id) ? ui.flip.delete(id) : ui.flip.add(id); renderList(); }
function listHtml() {
  const y = ui.year, ix = IX(), q = ui.q.trim().toLowerCase();
  if (!ix.rows.length) return '<div class="muted" style="padding:24px;text-align:center">還沒有資料。到「設定」匯入你的 Excel 名冊，或按「＋新增」。</div>';
  const hit = p => [p.name, p.roman, p.code, p.phone, p.rank, p.note].some(x => String(x || '').toLowerCase().includes(q));
  const fOk = p => { if (!ui.f) return true; if (p.deceased) return false; const f = feeOf(y, p.id);
    return ui.f === 'v' ? f.fee === 'v' : ui.f === 'unpaid' ? f.fee === 'v' && !f.paid : ui.f === 'paid' ? f.fee === 'v' && !!f.paid : ui.f === 'x' ? f.fee === 'x' : f.fee === ''; };

  if (C.note >= 0) for (let c = C.note + 1; c < width; c++) if (!hdr[c]) extra.push(c);

  const S = v => String(v == null ? '' : v).replace(/\r/g, '').trim(), LVC = [C.l0, C.l1, C.l2, C.fam];

    const lines = g(LVC[lv]).split('\n').map(s => s.trim()).filter(Boolean);
    let name = lines[0], dead = false, deathOn = '';
    if (/[（(]\s*歿\s*[)）]/.test(name)) { name = name.replace(/[（(]\s*歿\s*[)）]/, '').trim(); dead = true; }
    const note = [lines.slice(1).join('\n'), g(C.note)].concat(extra.map(g)).filter(Boolean).join('\n\n');
    const dl = note.split('\n').find(l => /歿/.test(l));
    if (dl) { dead = true; const dm = dl.match(/(\d{4})\D{1,2}(\d{1,2})\D{1,2}(\d{1,2})/); if (dm) deathOn = `${dm[1]}.${pad(dm[2])}.${pad(dm[3])}`; }
    const dt = (c, label) => { const o = normDate(c >= 0 ? r[c] : ''); if (o.fixed) fixes.push(`第 ${rn} 列 ${name} ${label}「${S(r[c])}」已改成 ${o.v}`); if (o.bad) fixes.push(`第 ${rn} 列 ${name} ${label}「${o.v}」看不懂，照原樣保留`); return o.v; };
    let code = g(C.code); if (/^[-－\s]*$/.test(code)) code = '';
    if (code && !/^\d{4}-\d{2}-\d{4}$/.test(code)) fixes.push(`第 ${rn} 列 ${name} 信徒編號「${code}」格式和別人不一樣`);
    const p = { id: uid(), status: 'member', name, roman: g(C.roman), birth: dt(C.birth, '出生年月日'), joinedOn: dt(C.joined, '入信時間'), code,
      rank: g(C.rank).split(/\s*[\n/]\s*/).filter(Boolean).join(' / '), phone: g(C.phone), note, deceased: dead, deathOn, famOf: '', mentorId: '', ord: people.length + 1 };
    rowOf.set(p.id, rn);
    if (lv === 3) {
      if (!last) { fixes.push(`第 ${rn} 列 ${name} 在家族入信欄，但上面沒有戶長，略過`); continue; }
      p.famOf = last.id;
    } else {
      if (lv === 0) { c0 = p; c1 = null; q0.push({ p, n: 0 }); }
      else if (lv === 1) { p.mentorId = c0 ? c0.id : ''; c1 = p; }
      else { p.mentorId = (c1 || c0 || {}).id || ''; if (!c1) fixes.push(`第 ${rn} 列 ${name} 在所屬欄，但上面沒有導子，改掛在導親名下`); }
      last = p;
      const fv = g(C.fee).toLowerCase(), fee = /^[v✓ˇ√]$/.test(fv) ? 'v' : fv === 'x' ? 'x' : '';
      if (fv && !fee) fixes.push(`第 ${rn} 列 ${name} 苑費「${g(C.fee)}」看不懂，當成空白`);
      const pv = C.paid >= 0 ? (typeof r[C.paid] === 'number' ? normDate(r[C.paid]).v : g(C.paid)) : '';
      if (fee || pv) fees.set(p.id, { id: year + ':' + p.id, year, pid: p.id, fee, paid: fee === 'v' ? pv : '' });
    }
    if (lv > 0 && q0.length) q0[q0.length - 1].n++;
    people.push(p);
  }
  q0.forEach((o, k) => {                                                  /* 導親欄、下面沒人、緊接著又是導親 → 我的導親（參考） */
    const nx = q0[k + 1]; if (o.n || !nx || fees.has(o.p.id)) return;
    o.p.ref = true; if (!nx.p.mentorId) nx.p.mentorId = o.p.id;
  });
  const byJ = new Map();                                                  /* 同一天入信、編號前 4 碼和多數人不同 → 可能打錯 */
  people.forEach(p => { if (/^\d{4}-/.test(p.code) && p.joinedOn) { if (!byJ.has(p.joinedOn)) byJ.set(p.joinedOn, []); byJ.get(p.joinedOn).push(p); } });
  byJ.forEach(list => { if (list.length < 3) return; const cnt = {}; list.forEach(p => { const k = p.code.slice(0, 4); cnt[k] = (cnt[k] || 0) + 1; });
    const top4 = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
    list.forEach(p => { if (p.code.slice(0, 4) !== top4) fixes.push(`第 ${rowOf.get(p.id)} 列 ${p.name} 信徒編號 ${p.code}，同一天入信的其他人都是 ${top4}-…，可能打錯`); }); });
  const seen = new Map(); people.forEach(p => { if (!p.code) return; if (seen.has(p.code)) fixes.push(`第 ${rowOf.get(seen.get(p.code).id)}、${rowOf.get(p.id)} 列信徒編號重複：${p.code}`); else seen.set(p.code, p); });
  const s = { l: [0, 0, 0], v: [0, 0, 0], fam: 0, ref: 0, dead: 0, x: 0, none: 0, paid: 0 }, lvOfP = new Map();
  people.forEach(p => { if (p.ref) return; const lv = p.famOf ? 3 : !p.mentorId || (people.find(x => x.id === p.mentorId) || {}).ref ? 0 : lvOfP.get(p.mentorId) === 0 ? 1 : 2; lvOfP.set(p.id, lv); });
  people.forEach(p => {
    if (p.ref) { s.ref++; return; }
    if (p.deceased) s.dead++;
    const lv = lvOfP.get(p.id); if (lv === 3) { s.fam++; return; }
    s.l[lv]++; if (p.deceased) return; const f = fees.get(p.id) || { fee: '' };
    if (f.fee === 'v') { s.v[lv]++; if (f.paid) s.paid++; } else if (f.fee === 'x') s.x++; else s.none++;
  });
  return { year, people, yr: Array.from(fees.values()).filter(f => !(people.find(p => p.id === f.pid) || {}).ref), fixes, sum: s, expect };
}
async function pickXlsx(f) {
  if (!f) return;
  try { await loadXlsx(); } catch (e) { return toast('Excel 元件載入失敗（需要網路）', 'err'); }
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    for (const sn of wb.SheetNames) {
      const ws = wb.Sheets[sn]; if (!ws['!ref']) continue;
      const res = parseRoster(XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '', blankrows: true }), XLSX.utils.decode_range(ws['!ref']).s.r);
      if (res) { imp = Object.assign(res, { file: f.name, sheet: sn }); $('#impBox').innerHTML = impHtml(); return; }
    }
    toast('找不到「導親」「家族入信」標題列，請確認是名冊格式', 'err');
  } catch (e) { console.error(e); toast('讀不了這個檔案：' + e.message, 'err'); }
}
function impHtml() {
  const s = imp.sum, ex = imp.expect, chk = k => ex[k] == null ? '' : ex[k] === s.v[k] ? '（和 Excel 上方相符）' : `（Excel 上方寫 ${ex[k]}，請核對）`;
  return `<div class="notice" style="margin-top:10px"><b>${esc(imp.file)}</b>（${esc(imp.sheet)}）：${imp.year} 苑費<br>
  導親 ${s.l[0]} 戶、導子 ${s.l[1]} 戶、所屬 ${s.l[2]} 戶、家族入信 ${s.fam} 人${s.ref ? `、我的導親（參考）${s.ref} 人` : ''}${s.dead ? `；其中已歿 ${s.dead} 人` : ''}<br>
  苑費 v：導親 ${s.v[0]}${chk(0)}／導子 ${s.v[1]}${chk(1)}／所屬 ${s.v[2]}${chk(2)}<br>x ${s.x} 戶、空白 ${s.none} 戶${s.paid ? `、已收 ${s.paid} 戶` : ''}</div>
  ${imp.fixes.length ? `<div class="muted" style="margin-top:8px"><b>請核對（${imp.fixes.length} 項）</b>${imp.fixes.map(t => `<div>・${esc(t)}</div>`).join('')}</div>` : ''}
  <div class="row" style="margin-top:10px"><button class="grow" onclick="doImport()">全部取代並匯入</button><button class="alt" onclick="imp=null;$('#impBox').innerHTML=''">取消</button></div>
  <div class="muted" style="margin-top:6px">會清掉目前 ${SMStore.all('people').length} 人與所有年度資料（含同步的雲端），換成這份 Excel。要留舊資料，請先在下面「備份」下載一份。</div>`;
}
function doImport() {
  if (!imp) return;
  const d = SMStore.read(), oldP = d.people.map(p => p.id), oldY = d.yearly.map(r => r.id);
  if (oldP.length && !confirm(`清掉目前 ${oldP.length} 人、${oldY.length} 筆年度資料，換成這份 Excel 的 ${imp.people.length} 人？\n清掉後無法復原。`)) return;
  SMStore.putMany('people', imp.people, oldP); SMStore.putMany('yearly', imp.yr, oldY);
  const n = imp.people.length; ui.year = imp.year; imp = null; ui.q = ''; ui.f = ''; ui.flip.clear(); go('roster'); toast('已匯入 ' + n + ' 人');
}

/* ═══════ 設定、同步、備份 ═══════ */
function vSettings() {
  const info = SMSync.info();
  $('#view').innerHTML = `<h2>設定</h2>
  <div class="panel"><h3>匯入 Excel 名冊</h3>
  <div class="muted">照你原本的名冊格式：苑費、導親、導子、導孫／所屬、家族入信、羅馬拼音、出生年月日、入信時間、信徒編號、院生號碼／教師號碼、手機、備註。看標題對欄位，順序不拘；這裡匯出的 Excel（多一欄「已收」）也能匯回來。<b>檔案只在這台裝置讀取，不會上傳。</b>匯入前會先給你看筆數和要核對的地方。</div>
  <input type="file" accept=".xlsx,.xls" style="margin-top:10px" onchange="pickXlsx(this.files[0]);this.value=''">
  <div id="impBox">${imp ? impHtml() : ''}</div></div>
  <div class="panel"><h3>匯出</h3><div class="row"><button class="sm" onclick="doXlsx()">下載 Excel（${ui.year} 苑費）</button><button class="alt sm" onclick="doPrint()">列印／存 PDF</button></div>
  <div class="muted" style="margin-top:6px">版型和你的 Excel 一樣，多一欄「已收」。年度在「名冊」上方切換。</div></div>
  <div class="panel"><h3>跨裝置同步</h3>${info ? `<div class="muted">已連線 GitHub：${esc(info.login)}（${info.encrypted ? '已加密' : '未加密'}）<br>${info.lastSync ? '最近同步 ' + new Date(info.lastSync).toLocaleString('zh-TW') : ''}</div>
  <div class="row" style="margin-top:8px"><button class="sm" onclick="SMSync.now(true)">立即同步</button><button class="alt sm" onclick="showPair()">配對碼（加第二台裝置）</button><button class="warn sm" onclick="if(confirm('中斷此裝置的同步？本機資料會保留。')){SMSync.disconnect();renderAll()}">中斷</button></div>
  ${SMSync.needsPassphrase() ? '<div class="notice" style="margin-top:8px">雲端資料有加密，請輸入同步密語：<input id="pp" type="password" style="margin:6px 0"><button class="sm" onclick="usePass()">確定</button></div>' : ''}`
  : `<div class="notice">信徒資料是高度隱私資訊：<b>資料存在你自己的加密私密 Gist</b>，網站原始碼裡沒有任何人名。沒有同步密語就不會上傳；密語忘記就無法解開，請另外記下。</div>
  <label>方法一：第一台裝置</label><div class="muted">① <a href="${SMSync.TOKEN_URL}" target="_blank" rel="noopener">建立 GitHub 金鑰（只勾 gist）</a> → 複製 ghp_ 開頭那串</div>
  <input id="tk" placeholder="貼上金鑰 ghp_…" autocomplete="off"><input id="pp" type="password" placeholder="自訂同步密語（至少 8 字，要記住）" style="margin-top:6px" autocomplete="new-password">
  <button style="margin-top:8px" onclick="doConnect()">連線並開始同步</button>
  <label>方法二：第二台以後（手機）</label><input id="pc" placeholder="貼上第一台產生的配對碼 SM1.…"><input id="pp2" type="password" placeholder="同步密語（配對碼已含金鑰時可留空）" style="margin-top:6px"><button class="alt" style="margin-top:8px" onclick="doPair()">用配對碼連線</button>`}</div>
  <div class="panel"><h3>單位名稱（列印抬頭）</h3><input id="org" value="${esc(orgName())}" placeholder="例：○○苑"><button class="sm" style="margin-top:8px" onclick="cfgSet('org',{name:$('#org').value.trim()});toast('已儲存')">儲存</button></div>
  <div class="panel"><h3>備份</h3><div class="row"><button class="alt sm" onclick="backup()">下載備份 JSON</button><button class="alt sm" onclick="$('#rf').click()">從備份還原</button><input id="rf" type="file" accept=".json" class="hidden" onchange="restore(this.files[0])"></div>
  <div class="muted" style="margin-top:6px">備份檔含完整個資，請存在私人位置，不要放進 GitHub。</div></div>
  <div class="muted" style="text-align:center">目前 ${IX().m.size} 人｜${YR().length} 筆年度資料</div>`;
}
async function doConnect() {
  const pass = $('#pp').value; if (pass.length < 8) return toast('同步密語至少 8 個字', 'err');
  try { const r = await SMSync.connect($('#tk').value, pass); toast(r.created ? '已建立加密雲端資料庫' : '已連上既有資料庫'); } catch (e) { toast(e.code === 'needpass' ? '雲端已有資料，請輸入原本的密語' : e.message, 'err'); }
  renderAll();
}
async function doPair() {
  try { await SMSync.connect($('#pc').value, $('#pp2').value); toast('已連線'); } catch (e) { toast(e.code === 'needpass' ? '請輸入同步密語' : e.message, 'err'); }
  renderAll();
}
async function usePass() { try { await SMSync.setPassphrase($('#pp').value); } catch (e) { toast(e.message, 'err'); } renderAll(); }
function showPair() {
  openModal(`<h2>配對碼</h2><div class="notice">這串碼<b>等同你的金鑰＋密語</b>，拿到的人能讀寫所有信徒資料。只貼進你自己的第二台裝置，用完刪掉訊息。</div>
  <textarea id="pcv" rows="5" readonly style="margin-top:8px;font-size:12px">${esc(SMSync.pairCode())}</textarea>
  <div class="row" style="margin-top:10px"><button class="grow" onclick="$('#pcv').select();navigator.clipboard&&navigator.clipboard.writeText($('#pcv').value);toast('已複製')">複製</button><button class="alt" onclick="closeModal()">關閉</button></div>`);
}
function backup() {
  const blob = new Blob([JSON.stringify(SMStore.read(), null, 1)], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'members-backup-' + todayStr() + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function restore(f) {
  if (!f) return; const rd = new FileReader();
  rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d || !Array.isArray(d.people)) throw 0;
    if (!confirm(`備份含 ${d.people.length} 人。與目前資料「合併」（同一筆以較新者為準），確定？`)) return;
    SMStore.write(SMSync.mergeData(SMStore.read(), Object.assign({ deleted: {} }, d))); SMSync.schedule(500); renderAll(); toast('已還原'); } catch (e) { toast('這不是有效的備份檔', 'err'); } };
  rd.readAsText(f);
}

/* ═══════ 啟動 ═══════ */
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
SMStore.attach(() => renderAll(), toast);
renderAll();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
